<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Quarterly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c0c14;color:#f1f0eb;font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;position:fixed;width:100%;top:0;left:0}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;min-height:0}
input,select,button,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=month]::-webkit-calendar-picker-indicator{filter:invert(0.5)}
.inp{background:#1a1a28;border:1.5px solid #ffffff0f;border-radius:10px;padding:9px 12px;color:#f1f0eb;font-size:13px;outline:none;width:100%}
.inp:focus{border-color:#a78bfa55}
.lbl{font-size:9px;color:#ffffff35;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;font-weight:600}
.card{background:#13131f;border:1.5px solid #ffffff08;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;border-radius:100px;padding:2px 7px;font-size:9px;font-weight:700;border:1px solid}
.pt{background:#ffffff08;border-radius:100px;overflow:hidden}
.pb{height:100%;border-radius:100px;transition:width .3s}
.er{background:#13131f;border:1.5px solid #ffffff12;border-radius:14px;padding:14px;margin-bottom:8px}
.er .fld{margin-bottom:8px}
.mbg{position:fixed;inset:0;background:#000000cc;z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#13131f;border:1.5px solid #ffffff0f;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h3{font-size:16px;font-weight:700;color:#f1f0eb}
.mh button{background:none;border:none;color:#475569;cursor:pointer;font-size:20px;padding:4px}
.row{display:flex;align-items:center;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.txrow{background:#13131f;border:1.5px solid #ffffff08;border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.recrow{background:#0a080f;border:1px solid #a78bfa18;border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sbar{background:linear-gradient(135deg,#0f1a0f,#0a0a1a);border-bottom:1px solid #1e1e2e;padding:6px 10px;flex-shrink:0;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sbar::-webkit-scrollbar{display:none}
.sp{background:#ffffff08;border-radius:10px;padding:5px 9px;flex-shrink:0}
.sp .sv{font-size:13px;font-weight:700}
.tabs{background:#0c0c14;border-bottom:2px solid #ffffff08;display:flex;flex-shrink:0}
.tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:#ffffff30;padding:8px 4px 6px;cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;margin-bottom:-2px;white-space:nowrap}
.tab.on{font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.segb{flex-shrink:0;background:#ffffff08;border:1.5px solid #ffffff0a;border-radius:20px;padding:5px 12px;color:#ffffff30;cursor:pointer;font-size:11px;font-weight:500;border:1.5px solid transparent}
.segb.on{font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e1e30;border:1.5px solid #ffffff14;border-radius:12px;padding:10px 18px;font-size:13px;color:#f1f0eb;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.dbtn{background:none;border:1px solid #ffffff0f;border-radius:6px;color:#ffffff25;cursor:pointer;font-size:10px;padding:2px 7px;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ── UTILS ──────────────────────────────────────────────────
var APP_VER = "quarterly-v11";
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function tod(){return new Date().toISOString().slice(0,10)}
function thisMo(){return new Date().toISOString().slice(0,7)}
function fmt(n){return "$"+Number(n||0).toFixed(2)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cl(s){return s?String(s).replace(/'/g,"\\'"):""}

function showToast(msg,color){
  var t=document.getElementById("toast");
  t.textContent=msg;t.style.background=color||"#1e1e30";
  t.style.borderColor=color?"#ffffff30":"#ffffff14";
  t.style.opacity="1";
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.style.opacity="0"},2200);
}

// ── STORAGE ────────────────────────────────────────────────
function saveD(){
  try{localStorage.setItem("qly_data",JSON.stringify(D));}catch(e){}
}
function loadD(){
  try{var s=localStorage.getItem("qly_data");return s?JSON.parse(s):null;}catch(e){return null;}
}

// ── SANITIZE ───────────────────────────────────────────────
function sanitize(d){
  if(!d)return d;
  d.income=Number(d.income)||0;
  if(!Array.isArray(d.debts))d.debts=[];
  if(!Array.isArray(d.goals))d.goals=[];
  if(!Array.isArray(d.transactions))d.transactions=[];
  if(!Array.isArray(d.recurring))d.recurring=[];
  if(!Array.isArray(d.incomeStreams))d.incomeStreams=[];
  if(!Array.isArray(d.oneTimeIncome))d.oneTimeIncome=[];
  if(!d.monthOverrides||typeof d.monthOverrides!=="object")d.monthOverrides={};
  if(!d.budgets||typeof d.budgets!=="object")d.budgets={};
  if(!Array.isArray(d.categories)||d.categories.length===0)d.categories=defCats();
  if(!d.month)d.month=thisMo();
  d.debts.forEach(function(x){x.total=Number(x.total)||0;x.paid=Number(x.paid)||0;x.rate=Number(x.rate)||0;x.monthly=Number(x.monthly)||0;});
  d.goals.forEach(function(x){x.target=Number(x.target)||0;x.saved=Number(x.saved)||0;});
  d.transactions.forEach(function(x){x.amount=Number(x.amount)||0;});
  d.recurring.forEach(function(x){x.amount=Number(x.amount)||0;x.day=Number(x.day)||1;});
  d.incomeStreams.forEach(function(x){x.amount=Number(x.amount)||0;x.day=Number(x.day)||1;});
  d.oneTimeIncome.forEach(function(x){x.amount=Number(x.amount)||0;});
  d.appVersion=APP_VER;
  return d;
}

// ── DEFAULT CATEGORIES ─────────────────────────────────────
function defCats(){
  return [
    {id:"housing",name:"Housing",icon:"🏠",color:"#60a5fa",subs:[{id:"hrent",name:"Rent",icon:"🏠"},{id:"hins",name:"Insurance",icon:"🛡️"}]},
    {id:"food",name:"Food",icon:"🍽️",color:"#4ade80",subs:[{id:"fgroc",name:"Groceries",icon:"🛒"},{id:"frest",name:"Restaurants",icon:"🍕"}]},
    {id:"transport",name:"Transport",icon:"🚗",color:"#facc15",subs:[{id:"tfuel",name:"Fuel",icon:"⛽"},{id:"tpub",name:"Public Transit",icon:"🚌"}]},
    {id:"utilities",name:"Utilities",icon:"⚡",color:"#f87171",subs:[{id:"uelec",name:"Electric",icon:"💡"},{id:"unet",name:"Internet",icon:"📶"}]},
    {id:"personal",name:"Personal",icon:"🧘",color:"#a78bfa",subs:[{id:"phair",name:"Haircut",icon:"💇"},{id:"ppkt",name:"Pocket Money",icon:"💵"}]},
    {id:"savings",name:"Savings",icon:"💰",color:"#2dd4bf",subs:[{id:"sjar",name:"Money Jar",icon:"🏦"}]},
    {id:"debt",name:"Debt Payments",icon:"💳",color:"#fb923c",subs:[]},
    {id:"other",name:"Other",icon:"📦",color:"#94a3b8",subs:[]}
  ];
}
function defBudgets(cats){
  var b={};
  (cats||[]).forEach(function(c){
    b[c.id]=0;
    (c.subs||[]).forEach(function(s){b[s.id]=0;});
  });
  return b;
}

// ── DATA ────────────────────────────────────────────────────
var _loaded=loadD();
var D=sanitize(_loaded)||sanitize({income:0,budgets:{},transactions:[],goals:[],debts:[],recurring:[],incomeStreams:[],oneTimeIncome:[],monthOverrides:{},month:thisMo(),categories:defCats()});
if(!D.budgets||Object.keys(D.budgets).length===0)D.budgets=defBudgets(D.categories);

// ── STATE ───────────────────────────────────────────────────
var S={
  tab:"home", seg:"income",
  showTx:false,showGoal:false,showDebt:false,showRec:false,
  editTx:null,editStream:null,editRec:null,editDebt:null,editGoal:null,editCat:null,
  showBackupMenu:false,showAdvisor:false,
  advisorMsgs:[],advisorLoading:false,advisorInput:"",
  debtStrat:"avalanche",showPayoff:false,showNetWorth:false,
  showAddStream:false
};

// ── INCOME ─────────────────────────────────────────────────
function streamMonthly(s){
  var a=Number(s.amount)||0;
  var f=s.freq;
  if(f==="weekly")return a*4.33;
  if(f==="biweekly")return a*2.17;
  if(f==="yearly")return a/12;
  return a;
}
function totalIncome(){
  if(D.monthOverrides[D.month]&&D.monthOverrides[D.month].income!=null)return Number(D.monthOverrides[D.month].income);
  var base=D.income||0;
  var streams=D.incomeStreams.reduce(function(a,s){return a+streamMonthly(s);},0);
  var oti=(D.oneTimeIncome||[]).filter(function(t){return t.month===D.month;}).reduce(function(a,t){return a+Number(t.amount);},0);
  return base+streams+oti;
}

// ── BUDGET ─────────────────────────────────────────────────
function totBudget(){
  return Object.values(D.budgets).reduce(function(a,v){return a+Number(v||0);},0);
}
function catSpent(cat,sp){
  var ids=[cat.id].concat((cat.subs||[]).map(function(s){return s.id;}));
  return ids.reduce(function(a,id){return a+(sp[id]||0);},0);
}
function spentBycat(){
  var sp={};
  D.transactions.filter(function(t){return t.month===D.month;}).forEach(function(t){
    if(!t.category)return;
    sp[t.category]=(sp[t.category]||0)+Number(t.amount||0);
  });
  return sp;
}

// ── TX OPTIONS ─────────────────────────────────────────────
function txOpts(){
  var opts=[];
  (D.categories||[]).forEach(function(c){
    opts.push({id:c.id,name:c.name,icon:c.icon||"📦",color:c.color||"#94a3b8",isParent:true});
    (c.subs||[]).forEach(function(s){
      opts.push({id:s.id,name:s.name,icon:s.icon||"📦",color:c.color||"#94a3b8"});
    });
  });
  return opts;
}
function optById(id){
  var opts=txOpts();
  for(var i=0;i<opts.length;i++){if(opts[i].id===id)return opts[i];}
  return {id:id,name:id,icon:"📦",color:"#94a3b8"};
}
function catOptsHTML(sel){
  var h="";
  (D.categories||[]).forEach(function(c){
    h+='<option value="'+esc(c.id)+'"'+(sel===c.id?" selected":"")+'>'+esc(c.icon)+" "+esc(c.name)+'</option>';
    (c.subs||[]).forEach(function(s){
      h+='<option value="'+esc(s.id)+'"'+(sel===s.id?" selected":"")+'>  └ '+esc(s.icon)+" "+esc(s.name)+'</option>';
    });
  });
  return h;
}

// ── DEBT PAYOFF ────────────────────────────────────────────
function calcPayoffOrder(strat){
  var debts=D.debts.map(function(d){return {id:d.id,name:d.name,remaining:d.total-d.paid,rate:d.rate||0,monthly:d.monthly||0};}).filter(function(d){return d.remaining>0;});
  if(strat==="avalanche")debts.sort(function(a,b){return b.rate-a.rate;});
  else debts.sort(function(a,b){return a.remaining-b.remaining;});
  return debts;
}
function calcPayoffMonths(remaining,rate,monthly){
  if(!monthly||monthly<=0)return null;
  if(!rate||rate<=0)return Math.ceil(remaining/monthly);
  var r=rate/100/12;
  if(monthly<=remaining*r)return null;
  return Math.ceil(Math.log(monthly/(monthly-remaining*r))/Math.log(1+r));
}

// ── PATCH/RENDER ───────────────────────────────────────────
function patch(obj){
  Object.assign(S,obj);
  render();
}
function render(){
  var el=document.getElementById("app");
  if(!el)return;
  el.innerHTML=buildApp();
  bindEv();
}
function bindEv(){
  var mp=document.getElementById("mpick");
  if(mp)mp.addEventListener("change",function(e){D.month=e.target.value;saveD();render();});
  if(S.showBackupMenu){
    setTimeout(function(){
      function dismiss(e){
        if(!e.target.closest||!e.target.closest("[data-bmenu]")){
          S.showBackupMenu=false;render();
          document.removeEventListener("click",dismiss);
        }
      }
      document.addEventListener("click",dismiss);
    },50);
  }
  if(S.showAdvisor){
    setTimeout(function(){
      var el=document.getElementById("adv-msgs");
      if(el)el.scrollTop=el.scrollHeight;
      var inp=document.getElementById("adv-inp");
      if(inp)inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();var v=inp.value.trim();if(v)sendAdvisor(v);}
      });
    },50);
  }
}

// ── BUILD APP ──────────────────────────────────────────────
function buildApp(){
  var cats=D.categories||defCats();
  var sp=spentBycat();
  var totB=totBudget();
  var totS=cats.reduce(function(a,c){return a+catSpent(c,sp);},0);
  var totI=totalIncome();
  var free=totI-totB;
  var h='<div style="padding:7px 10px 5px;display:flex;align-items:center;justify-content:space-between;background:#0c0c14;border-bottom:1px solid #ffffff08;flex-shrink:0">';
  h+='<div style="display:flex;align-items:center;gap:7px">';
  h+='<div style="width:26px;height:26px;background:linear-gradient(135deg,#7c6dfa,#4ade80);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px">&#x1F4B8;</div>';
  h+='<span style="font-size:15px;font-weight:700"><span style="color:#a78bfa">Quarter</span>ly</span>';
  h+='<input type="month" id="mpick" value="'+esc(D.month)+'" style="background:#1a1a28;border:1.5px solid #ffffff0f;border-radius:8px;padding:4px 7px;color:#f1f0eb;font-size:11px;font-weight:500;outline:none;width:112px"/>';
  h+='</div>';
  h+='<div style="display:flex;align-items:center;gap:4px">';
  // Backup button with dropdown
  h+='<div style="position:relative" data-bmenu="1">';
  h+='<button onclick="patch({showBackupMenu:!S.showBackupMenu})" style="background:#ffffff08;border:1.5px solid #ffffff0f;border-radius:8px;padding:5px 8px;color:#facc15;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:2px;line-height:1">&#x1F4BE;<span style="font-size:9px;opacity:.5">&#x25BE;</span></button>';
  if(S.showBackupMenu){
    h+='<div data-bmenu="1" style="position:absolute;top:calc(100% + 4px);right:0;background:#1e1e2e;border:1.5px solid #ffffff14;border-radius:12px;overflow:hidden;z-index:300;min-width:148px;box-shadow:0 8px 24px #000000b0">';
    h+='<button onclick="doExport();patch({showBackupMenu:false})" style="width:100%;background:none;border:none;padding:10px 14px;text-align:left;color:#facc15;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px">&#x1F4BE; Save Backup</button>';
    h+='<div style="height:1px;background:#ffffff08"></div>';
    h+='<label data-bmenu="1" style="width:100%;display:flex;align-items:center;gap:8px;padding:10px 14px;color:#60a5fa;cursor:pointer;font-size:12px">&#x1F4C2; Load Backup<input type="file" accept=".json" onchange="doImport(event)" style="display:none"/></label>';
    h+='</div>';
  }
  h+='</div>';
  h+='<label title="Import Debt PDF (SCHUFA)" style="background:#f8717112;border:1.5px solid #f8717130;border-radius:8px;padding:5px 8px;color:#f87171;cursor:pointer;font-size:13px;display:flex;align-items:center;line-height:1">&#x1F4CB;<input type="file" accept=".pdf" onchange="doImportPDF(event)" style="display:none"/></label>';
  h+='<button onclick="openAdvisor()" style="background:#a78bfa18;border:1.5px solid #a78bfa44;border-radius:8px;padding:5px 8px;color:#a78bfa;cursor:pointer;font-size:13px;line-height:1">&#x1F9E0;</button>';
  h+='</div></div>';
  // Stats bar
  h+='<div class="sbar">';
  h+=sp2("INCOME",fmt(totI),"#4ade80")+'<div style="width:1px;height:22px;background:#ffffff12;flex-shrink:0"></div>';
  h+=sp2("BUDGETED",fmt(totB),"#60a5fa");
  h+=sp2("SPENT",fmt(totS),"#fb923c");
  h+=sp2("FREE",fmt(free),free<0?"#f87171":"#4ade80");
  h+=sp2("LEFT",fmt(totB-totS),"#a78bfa");
  h+='</div>';
  // Tabs
  var tabs=[["home","📊 Home"],["budget","💰 Budget"],["pay","💳 Pay"],["money","⚡ Money"]];
  var tcols={home:"#a78bfa",budget:"#4ade80",pay:"#60a5fa",money:"#facc15"};
  h+='<div class="tabs">';
  tabs.forEach(function(t){
    var a=S.tab===t[0];var col=tcols[t[0]];
    h+='<button class="tab'+(a?" on":"")+'" onclick="patch({tab:\''+t[0]+'\'})" style="color:'+(a?col:"#ffffff30")+';border-bottom-color:'+(a?col:"transparent")+'">'+t[1]+'</button>';
  });
  h+='</div>';
  // Tab content
  h+='<div class="tc">';
  if(S.tab==="home")h+=tabHome(cats,sp,totB,totS,totI,free);
  else if(S.tab==="budget")h+=tabBudget(cats,sp,free);
  else if(S.tab==="pay")h+=tabPay();
  else if(S.tab==="money")h+=tabMoney(totI,cats,totI,totB);
  h+='</div>';
  // Modals
  if(S.showTx)h+=modalTx();
  if(S.showGoal)h+=modalGoal();
  if(S.showDebt)h+=modalDebt();
  if(S.showRec)h+=modalRec();
  if(S.showAdvisor)h+=modalAdvisor();
  return h;
}
function sp2(l,v,c){
  return '<div class="sp"><div class="lbl">'+l+'</div><div class="sv" style="color:'+c+'">'+v+'</div></div>';
}

// ── HOME TAB ───────────────────────────────────────────────
function tabHome(cats,sp,totB,totS,totI,free){
  var h="";
  // Health score
  var score=100;
  if(free<0)score-=30;else if(free<totI*0.1)score-=15;
  var totDebt=D.debts.reduce(function(a,d){return a+d.remaining||a+(d.total-d.paid);},0);
  var totDebtR=D.debts.reduce(function(a,d){return a+(d.total-d.paid);},0);
  if(totDebtR>totI*6)score-=20;else if(totDebtR>totI*3)score-=10;
  var pct=totB>0?totS/totB:0;
  if(pct>1)score-=20;else if(pct>0.9)score-=10;
  score=Math.max(0,Math.min(100,score));
  var scol=score>=80?"#4ade80":score>=60?"#facc15":"#f87171";
  var slbl=score>=80?"Great":score>=60?"OK":"Needs Work";
  var txCount=D.transactions.filter(function(t){return t.month===D.month;}).length;
  h+='<div class="card" style="border-color:'+scol+'22;margin-bottom:8px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center">';
  h+='<div><div class="lbl">FINANCIAL HEALTH</div><div style="font-size:36px;font-weight:800;color:'+scol+';line-height:1">'+score+'<span style="font-size:16px;opacity:.5">/100</span></div>';
  h+='<div style="font-size:12px;color:'+scol+';margin-top:2px">'+slbl+' for '+D.month+'</div></div>';
  h+='<div style="text-align:right"><div style="width:50px;height:50px;border-radius:50%;background:'+scol+';display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:4px;margin-left:auto">'+(score>=80?"😊":score>=60?"😐":"😟")+'</div>';
  h+='<div style="font-size:10px;color:#ffffff30">'+txCount+' payments</div></div>';
  h+='</div></div>';
  // Stat cards
  h+='<div class="row2" style="margin-bottom:8px">';
  h+=dashCard("💰","FREE MONEY",fmt(free),free<0?"#f87171":"#4ade80","Available");
  h+=dashCard("📊","BUDGET USED",Math.round(pct*100)+"%","#60a5fa",fmt(totS)+" of "+fmt(totB));
  h+=dashCard("💳","TOTAL DEBT",fmt(totDebtR),"#f87171",D.debts.length+" debts");
  h+=dashCard("🏦","SAVED",fmt(D.goals.reduce(function(a,g){return a+g.saved;},0)),"#2dd4bf",D.goals.length+" goals");
  h+='</div>';
  // Budget by category
  if(cats.length>0){
    h+='<div class="card" style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#f1f0eb;margin-bottom:10px">Budget by Category</div>';
    cats.forEach(function(cat){
      var bgt=Number(D.budgets[cat.id]||0);
      (cat.subs||[]).forEach(function(s){bgt+=Number(D.budgets[s.id]||0);});
      var spent=catSpent(cat,sp);
      var p=bgt>0?Math.min(spent/bgt*100,100):0;
      var col=p>100?"#f87171":p>80?"#facc15":"#4ade80";

// Forecast segment
function segForecast(cats,totI,totB){
  var months=[];
  var d=new Date();
  for(var i=0;i<4;i++){
    var mo=new Date(d.getFullYear(),d.getMonth()+i,1).toISOString().slice(0,7);
    months.push(mo);
  }
  var totDebt=D.debts.reduce(function(a,d2){return a+(d2.total-d2.paid);},0);
  var totSaved=D.goals.reduce(function(a,g){return a+g.saved;},0);
  var h='';
  months.forEach(function(mo){
    var mI=D.monthOverrides[mo]&&D.monthOverrides[mo].income!=null?Number(D.monthOverrides[mo].income):totI;
    var recTotal=D.recurring.reduce(function(a,r){
      var amt=Number(r.amount||0);
      if(r.freq==="weekly")return a+amt*4.33;
      if(r.freq==="biweekly")return a+amt*2.17;
      if(r.freq==="yearly")return a+amt/12;
      return a+amt;
    },0);
    var free=mI-totB;
    var isNow=mo===D.month;
    h+='<div class="card" style="margin-bottom:8px;'+(isNow?"border-color:#a78bfa44;":"")+'">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<div style="font-size:13px;font-weight:700;color:#f1f0eb">'+mo+(isNow?' <span style="font-size:9px;color:#a78bfa;background:#a78bfa18;padding:2px 6px;border-radius:100px;border:1px solid #a78bfa30">NOW</span>':'')+'</div>';
    h+='<div style="font-size:13px;font-weight:700;color:'+(free<0?"#f87171":"#4ade80")+';font-family:monospace">'+fmt(free)+' free</div></div>';
    h+='<div style="display:flex;gap:8px">';
    h+='<div style="flex:1;background:#ffffff05;border-radius:9px;padding:8px;text-align:center"><div class="lbl">INCOME</div><div style="font-size:13px;font-weight:600;color:#4ade80">'+fmt(mI)+'</div></div>';
    h+='<div style="flex:1;background:#ffffff05;border-radius:9px;padding:8px;text-align:center"><div class="lbl">BILLS</div><div style="font-size:13px;font-weight:600;color:#a78bfa">'+fmt(recTotal)+'</div></div>';
    h+='<div style="flex:1;background:#ffffff05;border-radius:9px;padding:8px;text-align:center"><div class="lbl">BUDGET</div><div style="font-size:13px;font-weight:600;color:#60a5fa">'+fmt(totB)+'</div></div>';
    h+='</div></div>';
  });
  h+='<div class="card"><div style="font-size:12px;font-weight:600;color:#f1f0eb;margin-bottom:8px">Debt Payoff Projection</div>';
  D.debts.forEach(function(d2){
    var rem=d2.total-d2.paid;
    var mo=calcPayoffMonths(rem,d2.rate,d2.monthly);
    h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff06">';
    h+='<span style="font-size:11px;color:#e2e8f0">'+esc(d2.name)+'</span>';
    h+='<span style="font-size:11px;color:#f87171;font-family:monospace">'+(mo?'~'+mo+' months':'set monthly payment')+'</span></div>';
  });
  if(D.debts.length===0)h+='<div style="font-size:11px;color:#ffffff25;text-align:center;padding:10px">Add debts to see projections</div>';
  h+='</div>';
  return h;
}

function buildFinancialSummary(){
  var totI=totalIncome(),totB=totBudget(),sp=spentBycat();
  var totS=( D.categories||[]).reduce(function(a,c){return a+catSpent(c,sp);},0);
  var lines=["Month: "+D.month,"Income: "+fmt(totI),"Budgeted: "+fmt(totB),"Spent: "+fmt(totS),"Free: "+fmt(totI-totB)];
  lines.push("Debts ("+D.debts.length+"): "+D.debts.map(function(d){return d.name+" "+fmt(d.total-d.paid)+" remaining";}).join(", ")||"none");
  lines.push("Goals ("+D.goals.length+"): "+D.goals.map(function(g){return g.name+" "+fmt(g.saved)+"/"+fmt(g.target);}).join(", ")||"none");
  lines.push("Recurring bills ("+D.recurring.length+"): "+D.recurring.map(function(r){return r.name+" "+fmt(r.amount);}).join(", ")||"none");
  return lines.join("\n");
}
async function sendAdvisor(msg){
  if(!msg||!msg.trim())return;
  var summary=buildFinancialSummary();
  var sys="You are a friendly personal financial advisor for the Quarterly budgeting app. The user is in a real financial situation and wants practical, specific advice. Use their actual numbers. Be concise, warm, and actionable.\n\nUSER FINANCIAL DATA:\n"+summary;
  S.advisorMsgs=S.advisorMsgs.concat([{role:"user",content:msg.trim()}]);
  S.advisorLoading=true;S.advisorInput="";render();
  try{
    var apiMsgs=S.advisorMsgs.map(function(m){return{role:m.role,content:m.content};});
    var resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:sys,messages:apiMsgs})
    });
    var data=await resp.json();
    var text=data.content&&data.content[0]?data.content[0].text:"Sorry, could not respond right now.";
    S.advisorMsgs=S.advisorMsgs.concat([{role:"assistant",content:text}]);
    S.advisorLoading=false;render();
  }catch(e){
    S.advisorMsgs=S.advisorMsgs.concat([{role:"assistant",content:"Connection error. Please try again."}]);
    S.advisorLoading=false;render();
  }
}

// ── BACKUP ─────────────────────────────────────────────────
function doExport(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="quarterly-backup-"+D.month+".json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  showToast("Backup saved!");
}
function doImport(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!imported.categories&&!imported.transactions){showToast("Invalid backup","#f87171");return;}
      imported=sanitize(imported);
      Object.assign(D,imported);
      saveD();render();showToast("Backup restored!");
    }catch(err){showToast("Could not read file","#f87171");}
  };
  reader.readAsText(file);
  event.target.value="";
}
async function doImportPDF(event){
  var file=event.target.files[0];
  if(!file)return;
  showToast("Reading PDF...");
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var base64=e.target.result.split(",")[1];
      showToast("AI scanning for debts...");
      var resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
            {type:"text",text:'Extract all debts, loans, or overdue accounts from this document. Return ONLY valid JSON with no markdown: {"debts":[{"name":"creditor name","total":amount_as_number,"paid":0,"rate":0,"monthly":0}]}. If nothing found return {"debts":[]}.'}
          ]}]
        })
      });
      var data=await resp.json();
      var text=(data.content&&data.content[0]&&data.content[0].text)||"{}";
      text=text.replace(/```json|```/g,"").trim();
      var result=JSON.parse(text);
      var added=0;
      (result.debts||[]).forEach(function(d){
        if(d.name&&d.total>0){
          var exists=D.debts.some(function(ex){return ex.name.toLowerCase()===d.name.toLowerCase();});
          if(!exists){D.debts.push({id:uid(),name:d.name,total:Number(d.total)||0,paid:0,rate:Number(d.rate)||0,monthly:Number(d.monthly)||0});added++;}
        }
      });
      if(added>0){saveD();render();showToast(added+" debt(s) imported!");patch({tab:"money",seg:"progress"});}
      else showToast("No new debts found in PDF","#facc15");
    }catch(err){showToast("Could not read PDF","#f87171");}
  };
  reader.readAsDataURL(file);
  event.target.value="";
}
