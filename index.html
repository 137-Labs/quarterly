<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Quarterly</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#0c0c14;color:#f1f0eb;min-height:100vh}
input,select,button{font-family:'Inter',sans-serif;-webkit-appearance:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* Scrollbars */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:2px}

/* Tab bar */
.tbar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tbar::-webkit-scrollbar{display:none}
.tbar button{flex-shrink:0}

/* Grid */
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}

/* Toast */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);color:#fff;padding:12px 24px;border-radius:100px;z-index:9999;font-size:13px;font-weight:500;display:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4);backdrop-filter:blur(10px)}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#13131f;border:1px solid #ffffff0f;border-radius:28px 28px 0 0;padding:28px 20px 40px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:#ffffff20;border-radius:2px;margin:0 auto 20px}

/* Inputs */
.inp{width:100%;background:#1a1a28;border:1.5px solid #ffffff0f;border-radius:14px;padding:13px 16px;color:#f1f0eb;font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:#7c6dfa55;background:#1e1e2e}
.inp-sm{background:#1a1a28;border:1.5px solid #ffffff0f;border-radius:10px;padding:7px 11px;color:#f1f0eb;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.inp-sm:focus{border-color:#7c6dfa55}

/* Buttons */
.btn{border:none;border-radius:16px;padding:15px 20px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;width:100%;margin-top:8px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98);opacity:.9}

/* Labels */
.lbl{font-size:11px;color:#ffffff50;font-family:'Inter',sans-serif;margin-bottom:6px;letter-spacing:.06em;font-weight:500;text-transform:uppercase}
.fld{display:flex;flex-direction:column;margin-bottom:2px}

/* Cards */
.card{background:#13131f;border:1.5px solid #ffffff08;border-radius:20px;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#ffffff14}

/* Progress bars */
.pt{background:#ffffff0a;border-radius:100px;overflow:hidden}
.pb{border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Icon buttons */
.ib{background:#ffffff08;border:1.5px solid #ffffff0f;border-radius:12px;padding:6px 9px;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;transition:background .15s}
.ib:active{background:#ffffff18}

/* Editable text */
.ed{cursor:text;border-bottom:1px dashed transparent;transition:border-color .15s}
.ed:hover{border-bottom-color:#ffffff30}
.ei{background:transparent;border:none;border-bottom:1.5px solid #7c6dfa;outline:none;color:#a78bfa;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;min-width:60px;max-width:160px}

/* Transaction rows */
.txr{background:#13131f;border:1.5px solid #ffffff08;border-radius:16px;padding:14px 15px;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.txr:active{border-color:#ffffff18}

/* Badges */
.bdg{font-size:10px;border-radius:100px;padding:3px 8px;font-family:'Inter',sans-serif;font-weight:500;white-space:nowrap;border-width:1px;border-style:solid}

/* Edit rows */
.edit-row{background:#13131f;border:1.5px solid #7c6dfa33;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* Nav tab active indicator */
.tab-active{color:#a78bfa!important;border-bottom-color:#a78bfa!important}

/* Stat boxes */
.stat-pill{background:#ffffff08;border-radius:12px;padding:8px 12px;flex-shrink:0}

/* Summary rows in forecast */
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#ffffff05;border-radius:12px}

select option{background:#1a1a28;color:#f1f0eb}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
var LS="budgetflow-v2";
function loadD(){
  try{
    var r=localStorage.getItem(LS);
    if(!r)return null;
    var d=JSON.parse(r);
    if(!d.categories)d.categories=defCats();
    d.categories=d.categories.map(function(c){return Object.assign({subs:[]},c);});
    if(!d.debts)d.debts=[];
    if(!d.goals)d.goals=[];
    if(!d.transactions)d.transactions=[];
    if(!d.recurring)d.recurring=[];
    if(!d.incomeStreams)d.incomeStreams=[];
    if(!d.monthOverrides)d.monthOverrides={};
    return d;
  }catch(e){return null;}
}
function saveD(d){try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}}
function fmt(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function tod(){return new Date().toISOString().slice(0,10);}
function thisMo(){return new Date().toISOString().slice(0,7);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function showToast(m,c){var t=document.getElementById("toast");t.textContent=m;t.style.background=c||"#22c55e";t.style.display="block";setTimeout(function(){t.style.display="none";},2400);}

function defCats(){
  return [
    {id:"housing",name:"Housing",icon:"\uD83C\uDFE0",color:"#4ade80",subs:[{id:"hrent",name:"Rent/Mortgage",icon:"\uD83C\uDFE1"},{id:"hins",name:"Home Insurance",icon:"\uD83D\uDEE1\uFE0F"}]},
    {id:"food",name:"Food & Dining",icon:"\uD83C\uDF54",color:"#fb923c",subs:[{id:"fgroc",name:"Groceries",icon:"\uD83D\uDED2"},{id:"frest",name:"Restaurants",icon:"\uD83C\uDF7D\uFE0F"},{id:"fcof",name:"Coffee",icon:"\u2615"}]},
    {id:"transport",name:"Transport",icon:"\uD83D\uDE97",color:"#60a5fa",subs:[{id:"tfuel",name:"Fuel",icon:"\u26FD"},{id:"tpub",name:"Public Transit",icon:"\uD83D\uDE8C"}]},
    {id:"utilities",name:"Utilities",icon:"\u26A1",color:"#facc15",subs:[{id:"uelec",name:"Electric",icon:"\uD83D\uDCA1"},{id:"unet",name:"Internet",icon:"\uD83D\uDCE1"}]},
    {id:"health",name:"Health",icon:"\uD83D\uDC8A",color:"#f472b6",subs:[]},
    {id:"entertainment",name:"Entertainment",icon:"\uD83C\uDFAE",color:"#a78bfa",subs:[]},
    {id:"shopping",name:"Shopping",icon:"\uD83D\uDECD\uFE0F",color:"#34d399",subs:[]},
    {id:"savings",name:"Savings",icon:"\uD83D\uDCB0",color:"#2dd4bf",subs:[]},
    {id:"debtcat",name:"Debt Payoff",icon:"\uD83D\uDCB3",color:"#f87171",subs:[]},
    {id:"other",name:"Other",icon:"\uD83D\uDCE6",color:"#94a3b8",subs:[]}
  ];
}
function defBudgets(cats){
  var presets={
    "debts":0,"debts-swa":180,"debts-bcs":60,"debts-pdf":250,"debts-cs":260,
    "fixed":0,"fixed-far":221,"fixed-pai":36,"fixed-mbf":10,"fixed-vhs":330,"fixed-deu":63,
    "personal":0,"personal-psn":9,"personal-pm":5,"personal-hc":25,"personal-pkt":61,
    "emergency":0,"emergency-sav":50,
    "other":0
  };
  var b={};
  cats.forEach(function(c){
    b[c.id]=presets[c.id]!==undefined?presets[c.id]:0;
    (c.subs||[]).forEach(function(s){b[s.id]=presets[s.id]!==undefined?presets[s.id]:0;});
  });
  return b;
}

var APP_VERSION = "v3-custom-cats";
var D=loadD()||{income:0,budgets:{},transactions:[],goals:[],debts:[],recurring:[],incomeStreams:[],monthOverrides:{},month:thisMo(),categories:defCats()};
if(!D.monthOverrides)D.monthOverrides={};

// Version migration — if old version, replace categories and budgets but keep all personal data
if(D.appVersion !== APP_VERSION){
  D.appVersion = APP_VERSION;
  D.categories = defCats();
  D.budgets = defBudgets(D.categories);
  saveD(D);
}

// Ensure any budget entries exist for all categories
(function(){var cats=D.categories||defCats();cats.forEach(function(c){if(D.budgets[c.id]===undefined)D.budgets[c.id]=0;(c.subs||[]).forEach(function(s){if(D.budgets[s.id]===undefined)D.budgets[s.id]=0;});});})();

var S={tab:"budget",emojiPicker:null,editingId:null,collapsed:{},showTx:false,showGoal:false,showDebt:false,showRec:false,editTx:null,editStreamId:null,editRecId:null,editDebtId:null,editGoalId:null,newTx:{name:"",amount:"",category:"",date:tod(),makeRec:false,recFreq:"monthly",recDay:"1",moveTo:""},newGoal:{name:"",target:"",saved:"",icon:"\uD83C\uDFAF"},newDebt:{name:"",total:"",paid:"",rate:"",monthly:""},newRec:{name:"",amount:"",category:"",freq:"monthly",day:"1",isTransfer:false,transferTo:""},showForecastDebt:false,showForecastSavings:false,makeRecTxId:null,showAdvisor:false,advisorLoading:false,advisorText:""};

function patch(o){Object.assign(S,o);render();}
function sbcFn(mo){var a={};var m=mo||D.month;D.transactions.forEach(function(t){if(t.month===m)a[t.category]=(a[t.category]||0)+Number(t.amount);});return a;}
function catSpent(cat,s){var t=s[cat.id]||0;(cat.subs||[]).forEach(function(sub){t+=s[sub.id]||0;});return t;}
function catBudget(cat){var t=Number(D.budgets[cat.id])||0;(cat.subs||[]).forEach(function(sub){t+=Number(D.budgets[sub.id])||0;});return t;}
function totBudget(){return (D.categories||defCats()).reduce(function(a,c){return a+catBudget(c);},0);}
function moLabel(y,m){var mo=((m-1)%12+12)%12,yr=y+Math.floor((m-1)/12);var ns=["January","February","March","April","May","June","July","August","September","October","November","December"];return ns[mo]+" "+yr;}
function moKey(y,m){var mo=((m-1)%12+12)%12+1,yr=y+Math.floor((m-1)/12);return yr+"-"+(mo<10?"0":"")+mo;}
function streamMonthly(s){var a=Number(s.amount)||0;if(s.freq==="biweekly")return a*2.17;if(s.freq==="weekly")return a*4.33;if(s.freq==="yearly")return a/12;return a;}
function totalIncome(){
  // Check if current month has an income override
  if(D.monthOverrides&&D.monthOverrides[D.month]&&D.monthOverrides[D.month].income!=null){
    return Number(D.monthOverrides[D.month].income);
  }
  var base=Number(D.income)||0;
  var streams=D.incomeStreams.reduce(function(a,s){return a+streamMonthly(s);},0);
  return base+streams;
}
function moIncome(moKey2){var ov=D.monthOverrides[moKey2];return ov&&ov.income!=null?Number(ov.income):totalIncome();}
function moBudget(moKey2){var ov=D.monthOverrides[moKey2];return ov&&ov.budget!=null?Number(ov.budget):totBudget();}

function txOpts(){
  var cats=D.categories||defCats(),r=[];
  cats.forEach(function(c){
    r.push({id:c.id,name:c.name,icon:c.icon,color:c.color});
    (c.subs||[]).forEach(function(s){r.push({id:s.id,name:s.name,icon:s.icon,color:c.color,parent:c.id});});
  });
  D.debts.forEach(function(d){r.push({id:"debt::"+d.id,name:d.name,icon:"\uD83D\uDCB3",color:"#f87171"});});
  D.goals.forEach(function(g){r.push({id:"goal::"+g.id,name:g.name,icon:g.icon||"\uD83D\uDCB0",color:"#2dd4bf"});});
  return r;
}

function render(){document.getElementById("app").innerHTML=buildApp();bindEv();}

function buildApp(){
  var cats=D.categories||defCats(),sp=sbcFn(),opts=txOpts();
  var totB=totBudget();
  var totS=cats.reduce(function(a,c){return a+catSpent(c,sp);},0);
  var totI=totalIncome();
  var unalloc=totI-totB;
  var h="";
  h+='<div style="padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;background:#0c0c14;position:sticky;top:0;z-index:100;border-bottom:1px solid #ffffff08">';
  h+='<div style="display:flex;align-items:center;gap:10px">';
  h+='<div style="width:36px;height:36px;background:linear-gradient(135deg,#7c6dfa,#4ade80);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">&#x1F4B8;</div>';
  h+='<div><div style="font-size:18px;font-weight:700;color:#f1f0eb;letter-spacing:-.3px"><span style="color:#a78bfa">Quarter</span>ly</div>';
  h+='<div style="font-size:11px;color:#ffffff40;font-weight:400">Zero-Based Budgeting</div></div></div>';
  h+='<div style="display:flex;align-items:center;gap:6px">';
  h+='<input type="month" id="mpick" value="'+esc(D.month)+'" style="background:#1a1a28;border:1.5px solid #ffffff0f;border-radius:12px;padding:7px 11px;color:#f1f0eb;font-family:Inter,sans-serif;font-size:12px;font-weight:500;outline:none"/>';
  h+='<button onclick="exportData()" title="Backup" style="background:#ffffff08;border:1.5px solid #ffffff0f;border-radius:12px;padding:7px 10px;color:#facc15;cursor:pointer;font-size:15px;flex-shrink:0">&#x1F4BE;</button>';
  h+='<label title="Restore" style="background:#ffffff08;border:1.5px solid #ffffff0f;border-radius:12px;padding:7px 10px;color:#60a5fa;cursor:pointer;font-size:15px;flex-shrink:0;display:flex;align-items:center">&#x1F4C2;<input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label>';
  h+='<button onclick="openAdvisor()" title="AI Advisor" style="background:linear-gradient(135deg,#a78bfa22,#7c6dfa22);border:1.5px solid #a78bfa44;border-radius:12px;padding:7px 10px;color:#a78bfa;cursor:pointer;font-size:15px;flex-shrink:0">&#x1F9E0;</button>';
  h+='</div></div>';
  h+='<div style="background:linear-gradient(135deg,#0f1a0f,#0a0a1a);border-bottom:1px solid #1e1e2e;padding:12px 16px">';
  h+='<div style="display:flex;align-items:center;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch">';
  h+='<div style="flex-shrink:0"><div class="lbl">TOTAL INCOME</div>';
  h+='<div style="display:flex;align-items:center;gap:6px">';
  h+='<div style="font-size:18px;font-weight:bold;color:#4ade80;font-family:monospace">'+fmt(totI)+'</div>';
  h+='<button onclick="patch({tab:\'income\'})" style="background:#4ade8022;border:1px solid #4ade8044;border-radius:6px;color:#4ade80;cursor:pointer;font-size:10px;padding:3px 7px;font-family:monospace">MANAGE</button>';
  h+='</div></div>';
  h+='<div style="width:1px;height:32px;background:#1e1e2e;flex-shrink:0"></div>';
  h+=sbox("BUDGETED",fmt(totB),"#60a5fa");
  h+=sbox("SPENT",fmt(totS),"#fb923c");
  h+=sbox("FREE",fmt(unalloc),unalloc<0?"#f87171":"#4ade80");
  h+=sbox("LEFT",fmt(totB-totS),"#a78bfa");
  h+='</div></div>';
  var tabs=[["budget","Budget"],["transactions","Transactions"],["income","Income"],["recurring","Recurring"],["forecast","Forecast"],["goals","Goals"],["debt","Debt"]];
  h+='<div class="tbar" style="border-bottom:1px solid #1e1e2e;background:#0d0d16;padding:0 4px">';
  tabs.forEach(function(t){var a=S.tab===t[0];h+='<button onclick="patch({tab:\''+t[0]+'\'})" style="background:none;border:none;border-bottom:'+(a?"2px solid #4ade80":"2px solid transparent")+';color:'+(a?"#4ade80":"#64748b")+';padding:12px 12px;cursor:pointer;font-family:monospace;font-size:12px;white-space:nowrap">'+t[1]+'</button>';});
  h+='</div>';
  h+='<div style="padding:16px 16px 80px;max-width:900px;margin:0 auto">';
  if(S.tab==="budget")h+=tabBudget(cats,sp,unalloc);
  else if(S.tab==="transactions")h+=tabTx(opts);
  else if(S.tab==="income")h+=tabIncome(totI);
  else if(S.tab==="recurring")h+=tabRecurring(opts);
  else if(S.tab==="forecast")h+=tabForecast(cats,totI,totB);
  else if(S.tab==="goals")h+=tabGoals();
  else if(S.tab==="debt")h+=tabDebt();
  h+='</div>';
  if(S.emojiPicker)h+=modalEmoji();
  if(S.showAdvisor)h+=modalAdvisor();
  if(S.makeRecTxId)h+=modalMakeRec(cats);
  if(S.showTx)h+=modalTx(cats);
  if(S.editTx)h+=modalEditTx(cats);
  if(S.showGoal)h+=modalGoal();
  if(S.showDebt)h+=modalDebt();
  if(S.showRec)h+=modalRec(cats);
  return h;
}

function sbox(l,v,c){return '<div class="stat-pill"><div style="font-size:10px;color:#ffffff40;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">'+l+'</div><div style="font-size:15px;font-weight:700;color:'+c+'">'+v+'</div></div>';}
function sbox2(l,v,c){return '<div style="background:#ffffff06;border:1.5px solid #ffffff08;border-radius:14px;padding:10px 10px 9px">'+'<div style="font-size:9px;color:#ffffff35;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">'+l+'</div>'+'<div style="font-size:13px;font-weight:700;color:'+c+';letter-spacing:-.2px">'+v+'</div></div>';}

// ── BUDGET TAB ───────────────────────────────────────────
function tabBudget(cats,sp,unalloc){
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px">';
  h+='<div style="font-size:11px;color:#ffffff30;font-weight:400">Tap icon or name to edit</div>';
  h+='<button onclick="addCat()" style="background:#a78bfa15;border:1.5px solid #a78bfa30;border-radius:12px;padding:8px 14px;color:#a78bfa;cursor:pointer;font-size:12px;font-weight:600">+ Category</button>';
  h+='</div>';
  if(unalloc!==0){var neg=unalloc<0;h+='<div style="background:'+(neg?"#f8717108":"#4ade8008")+';border:1.5px solid '+(neg?"#f8717130":"#4ade8030")+';border-radius:14px;padding:11px 16px;margin-bottom:14px;font-size:13px;font-weight:500;color:'+(neg?"#f87171":"#4ade80")+'">'+(neg?"⚠️ Over-budgeted by "+fmt(Math.abs(unalloc)):"💡 "+fmt(unalloc)+" left to assign")+'</div>';}
  h+='<div style="display:flex;flex-direction:column;gap:10px">';
  cats.forEach(function(cat){h+=catCard(cat,sp);});
  h+='</div>';
  return h;
}

function catCard(cat,sp){
  var pB=catBudget(cat),pS=catSpent(cat,sp),pR=pB-pS,pct=pB>0?Math.min((pS/pB)*100,100):0;
  var hasSubs=(cat.subs||[]).length>0,coll=S.collapsed[cat.id];
  var ek="cat::"+cat.id,isEd=S.editingId===ek;
  var h='<div class="card"><div style="padding:13px 13px 11px">';
  h+='<div style="display:flex;align-items:center;gap:7px;margin-bottom:9px">';
  h+='<button onclick="patch({collapsed:Object.assign({},S.collapsed,{\''+cat.id+'\':(S.collapsed[\''+cat.id+'\']?false:true)})})" style="background:none;border:none;color:'+(hasSubs?"#64748b":"transparent")+';cursor:'+(hasSubs?"pointer":"default")+';font-size:11px;padding:2px;width:16px;flex-shrink:0">'+(hasSubs?(coll?"&#x25B6;":"&#x25BC;"):"")+'</button>';
  h+='<button class="ib" onclick="openEmoji(\'cat\',\''+cat.id+'\',\'\')">'+cat.icon+'</button>';
  if(isEd){h+='<input class="ei" id="ei-'+ek+'" value="'+esc(cat.name)+'" onblur="saveCN(\''+cat.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\')patch({editingId:null})" style="font-size:14px"/>';}
  else{h+='<span class="ed" onclick="patch({editingId:\''+ek+'\'})" style="font-size:14px;font-weight:bold;color:#e2e8f0">'+esc(cat.name)+' <span style="font-size:10px;color:#3d3d5e">&#x270E;</span></span>';}
  h+='<div style="margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0">';
  h+='<span style="font-size:11px;color:'+(pR<0?"#f87171":"#475569")+';font-family:monospace">'+(pR<0?"OVER":fmt(pR)+" left")+'</span>';
  h+='<button onclick="addSub(\''+cat.id+'\')" style="background:none;border:1px solid #2d2d3e;border-radius:5px;color:#64748b;cursor:pointer;padding:2px 6px;font-size:11px;font-family:monospace">+sub</button>';
  h+='<button onclick="removeCat(\''+cat.id+'\')" style="background:none;border:none;color:#3d3d4e;cursor:pointer;font-size:13px;padding:2px">&#x2715;</button>';
  h+='</div></div>';

function txRow(tx,opts){
  var opt=null;for(var i=0;i<opts.length;i++){if(opts[i].id===tx.category){opt=opts[i];break;}}if(!opt)opt={icon:"\uD83D\uDCE6",name:tx.category,color:"#94a3b8"};
  var lDebt=null,lGoal=null;
  if(tx.isDebtPay){for(var j=0;j<D.debts.length;j++){if(String(D.debts[j].id)===String(tx.debtId)){lDebt=D.debts[j];break;}}}
  if(tx.isGoalSave){for(var k=0;k<D.goals.length;k++){if(String(D.goals[k].id)===String(tx.goalId)){lGoal=D.goals[k];break;}}}
  var dp=lDebt?Math.min(((Number(lDebt.paid)||0)/(Number(lDebt.total)||1))*100,100):0;
  var gp=lGoal?Math.min(((Number(lGoal.saved)||0)/(Number(lGoal.target)||1))*100,100):0;
  var bg=tx.isDebtPay?"background:#100a0a;border-color:#f8717133":tx.isGoalSave?"background:#0a100e;border-color:#2dd4bf33":"";
  var h='<div class="txr" style="'+bg+'">';
  h+='<div style="width:34px;height:34px;border-radius:8px;background:'+(opt.color||"#94a3b8")+'22;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0">'+opt.icon+'</div>';

  h+='<span style="font-size:14px;color:#e2e8f0;font-weight:bold">'+esc(tx.name)+'</span>';
  if(tx.isTransfer&&tx.isTransferIn)h+='<span class="bdg" style="background:#2dd4bf22;color:#2dd4bf;border-color:#2dd4bf44">TRANSFER IN</span>';
  else if(tx.isTransfer)h+='<span class="bdg" style="background:#2dd4bf22;color:#2dd4bf;border-color:#2dd4bf44">TRANSFER OUT</span>';
  else if(tx.isDebtPay)h+='<span class="bdg" style="background:#f8717122;color:#f87171;border-color:#f8717144">DEBT</span>';
  else if(tx.isGoalSave)h+='<span class="bdg" style="background:#2dd4bf22;color:#2dd4bf;border-color:#2dd4bf44">SAVINGS</span>';
  else h+='<span class="bdg" style="background:#60a5fa22;color:#60a5fa;border-color:#60a5fa33">BUDGET</span>';
  if(tx.fromRec)h+='<span class="bdg" style="background:#a78bfa22;color:#a78bfa;border-color:#a78bfa44">REC</span>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#475569;font-family:monospace;margin-top:2px">'+esc(opt.name)+' - '+tx.date;

  return h;

// ── FORECAST TAB ─────────────────────────────────────────
function tabForecast(cats,totI,totB){
  var base=D.month.split("-"),y=parseInt(base[0]),m=parseInt(base[1]);
  var months=[{label:moLabel(y,m),key:moKey(y,m)},{label:moLabel(y,m+1),key:moKey(y,m+1)},{label:moLabel(y,m+2),key:moKey(y,m+2)},{label:moLabel(y,m+3),key:moKey(y,m+3)}];
  var h='<div style="margin-bottom:14px"><div style="font-size:13px;color:#64748b;font-family:monospace;margin-bottom:2px">4-month forecast - tap any value to override for that month</div><div style="font-size:11px;color:#3d3d5e;font-family:monospace">Swipe to see all months</div></div>';
  // Summary row at top
  var grandTotalIncome=0,grandTotalRec=0,grandTotalSpent=0;
  h+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px"><div style="display:flex;gap:12px;min-width:min-content">';
  months.forEach(function(mo){
    var isCur=mo.key===D.month;
    var ov=D.monthOverrides[mo.key]||{};
    var moI=ov.income!=null?Number(ov.income):totI;
    var moB=ov.budget!=null?Number(ov.budget):totB;
    var actualSpent=D.transactions.filter(function(t){return t.month===mo.key&&!t.isTransferIn;}).reduce(function(a,t){return a+Number(t.amount);},0);
    var recItems=D.recurring.filter(function(r){return r.freq==="monthly";});
    var postedIds=D.transactions.filter(function(t){return t.month===mo.key&&t.fromRec;}).map(function(t){return t.recId;});
    // Only count UNPOSTED recurring items in projection - posted ones already in actualSpent
    var unpostedRec=recItems.filter(function(r){return postedIds.indexOf(r.id)===-1;});
    var recTotal=unpostedRec.reduce(function(a,r){return a+Number(r.amount);},0);
    var remaining=moI-actualSpent-recTotal;
    var actPct=moI>0?Math.min((actualSpent/moI)*100,100):0;
    var recPct=moI>0?Math.min(((actualSpent+recTotal)/moI)*100,100):0;
    grandTotalIncome+=moI;grandTotalRec+=recTotal;grandTotalSpent+=actualSpent;
    h+='<div style="min-width:265px;max-width:300px;background:#0d0d16;border:1px solid '+(isCur?"#4ade8055":"#1e1e2e")+';border-radius:14px;padding:14px;flex-shrink:0">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px">';
    h+='<div><div style="font-size:15px;font-weight:bold;color:'+(isCur?"#4ade80":"#e2e8f0")+'">'+(isCur?"* ":"")+mo.label+'</div>'+(isCur?'<div style="font-size:10px;color:#4ade80;font-family:monospace">CURRENT</div>':'')+'</div>';

function applyTx(tx,sign){
  if(tx.isDebtPay)D.debts=D.debts.map(function(d){return String(d.id)===String(tx.debtId)?Object.assign({},d,{paid:Math.max(0,Number(d.paid||0)+(sign*Number(tx.amount)))}):d;});
  if(tx.isGoalSave)D.goals=D.goals.map(function(g){return String(g.id)===String(tx.goalId)?Object.assign({},g,{saved:Math.max(0,Number(g.saved||0)+(sign*Number(tx.amount)))}):g;});
}
function submitTx(){
  var name=(document.getElementById("tx-n")||{}).value||"";name=name.trim();
  var amount=(document.getElementById("tx-a")||{}).value||"";
  var category=(document.getElementById("tx-c")||{}).value||"";
  var date=(document.getElementById("tx-d")||{}).value||tod();
  var moveTo=(document.getElementById("tx-mt")||{}).value||"";
  if(!name||!amount){showToast("Fill in description & amount","#f87171");return;}
  var month=date.slice(0,7);
  var isDebt=category.indexOf("debt::")===0, isGoal=category.indexOf("goal::")===0;
  var debtId=isDebt?category.replace("debt::","").trim():null;
  var goalId=isGoal?category.replace("goal::","").trim():null;
  // Create the main expense transaction
  var tx={id:uid(),name:name,amount:amount,category:category,date:date,month:month,isDebtPay:isDebt,debtId:debtId,isGoalSave:isGoal,goalId:goalId,moveTo:moveTo};
  D.transactions.unshift(tx);
  applyTx(tx,1);
  // If Move To is set, create the receiving entry automatically
  if(moveTo){
    var rxIsDebt=moveTo.indexOf("debt::")===0;
    var rxIsGoal=moveTo.indexOf("goal::")===0;
    var rxDebtId=rxIsDebt?moveTo.replace("debt::","").trim():null;
    var rxGoalId=rxIsGoal?moveTo.replace("goal::","").trim():null;
    var rxTx={id:uid(),name:name+" → received",amount:amount,category:moveTo,date:date,month:month,
      isDebtPay:rxIsDebt,debtId:rxDebtId,isGoalSave:rxIsGoal,goalId:rxGoalId,isTransferIn:true,linkedId:tx.id};
    D.transactions.unshift(rxTx);
    applyTx(rxTx,1);
  }
  // Save as recurring if checked
  if(S.newTx.makeRec){
    var freq=(document.getElementById("tx-rf")||{}).value||"monthly";
    var day=(document.getElementById("tx-rd")||{}).value||"1";
    D.recurring.push({id:uid(),name:name,amount:amount,category:category,freq:freq,day:day,moveTo:moveTo});
  }
  saveD(D);
  var msg=moveTo?"Money moved! ✓":(isDebt?"Applied to debt!":(isGoal?"Added to savings goal!":"Transaction added!"));
  if(S.newTx.makeRec) msg+=" + set as recurring";
  patch({showTx:false,newTx:{name:"",amount:"",category:"",date:tod(),makeRec:false,recFreq:"monthly",recDay:"1",moveTo:""}});
  showToast(msg);
}
function submitEditTx(){
  var tx=S.editTx;if(!tx)return;
  var name=(document.getElementById("etx-n")||{}).value||"";name=name.trim();
  var amount=(document.getElementById("etx-a")||{}).value||"";
  var category=(document.getElementById("etx-c")||{}).value||"";
  var date=(document.getElementById("etx-d")||{}).value||tod();
  if(!name||!amount){showToast("Fill in description & amount","#f87171");return;}
  applyTx(tx,-1);
  var month=date.slice(0,7),isDebt=category.indexOf("debt::")===0,isGoal=category.indexOf("goal::")===0;
  var debtId=isDebt?category.replace("debt::","").trim():null,goalId=isGoal?category.replace("goal::","").trim():null;
  var upd=Object.assign({},tx,{name:name,amount:amount,category:category,date:date,month:month,isDebtPay:isDebt,debtId:debtId,isGoalSave:isGoal,goalId:goalId});
  D.transactions=D.transactions.map(function(t){return String(t.id)===String(tx.id)?upd:t;});
  applyTx(upd,1);
  // Handle transfer in edit
  var editIsTransfer=document.getElementById("etx-tr")&&document.getElementById("etx-tr").checked;
  var editTransferTo=editIsTransfer?(document.getElementById("etx-tt")||{}).value||"":"";
  if(editIsTransfer&&editTransferTo){
    var exIsDebt=editTransferTo.indexOf("debt::")===0;
    var exIsGoal=editTransferTo.indexOf("goal::")===0;
    var exDebtId=exIsDebt?editTransferTo.replace("debt::","").trim():null;
    var exGoalId=exIsGoal?editTransferTo.replace("goal::","").trim():null;
    var exTx={id:uid(),name:name+" (transfer in)",amount:amount,category:editTransferTo,date:date,month:month,isDebtPay:exIsDebt,debtId:exDebtId,isGoalSave:exIsGoal,goalId:exGoalId,isTransfer:true,isTransferIn:true};
    D.transactions.unshift(exTx);applyTx(exTx,1);
  }
  // Handle make recurring in edit
  var editMakeRec=document.getElementById("etx-mr")&&document.getElementById("etx-mr").checked;
  if(editMakeRec){
    var erFreq=(document.getElementById("etx-rf")||{}).value||"monthly";
    var erDay=(document.getElementById("etx-rd")||{}).value||"1";
    D.recurring.push({id:uid(),name:name,amount:amount,category:category,freq:erFreq,day:erDay,isTransfer:editIsTransfer,transferTo:editTransferTo});
  }
  saveD(D);patch({editTx:null});showToast("Transaction updated!");

function delTx(txId){

function postRec(recId,moKey2){
  var r=null;for(var i=0;i<D.recurring.length;i++){if(String(D.recurring[i].id)===String(recId)){r=D.recurring[i];break;}}if(!r)return;
  var parts=moKey2.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1]);
  var day=Math.min(Number(r.day),new Date(yr,mo,0).getDate());
  var date=moKey2+"-"+(day<10?"0":"")+day;
  var isDebt=r.category.indexOf("debt::")===0,isGoal=r.category.indexOf("goal::")===0;
  var debtId=isDebt?r.category.replace("debt::","").trim():null,goalId=isGoal?r.category.replace("goal::","").trim():null;
  var rMoveTo=r.moveTo||r.transferTo||"";
  var tx={id:uid(),name:r.name,amount:r.amount,category:r.category,date:date,month:moKey2,isDebtPay:isDebt,debtId:debtId,isGoalSave:isGoal,goalId:goalId,fromRec:true,recId:recId,moveTo:rMoveTo};
  D.transactions.unshift(tx);applyTx(tx,1);
  if(rMoveTo){
    var rxIsDebt2=rMoveTo.indexOf("debt::")===0;
    var rxIsGoal2=rMoveTo.indexOf("goal::")===0;
    var rxDebtId2=rxIsDebt2?rMoveTo.replace("debt::","").trim():null;
    var rxGoalId2=rxIsGoal2?rMoveTo.replace("goal::","").trim():null;
    var rxTx2={id:uid(),name:r.name+" (moved in)",amount:r.amount,category:rMoveTo,date:date,month:moKey2,isDebtPay:rxIsDebt2,debtId:rxDebtId2,isGoalSave:rxIsGoal2,goalId:rxGoalId2,fromRec:true,recId:recId,isTransferIn:true};
    D.transactions.unshift(rxTx2);applyTx(rxTx2,1);
  }
  saveD(D);render();showToast("Posted to "+moKey2+"!");
}

function buildFinancialSummary(){
  var cats=D.categories||defCats();
  var sp=sbcFn();
  var totI=totalIncome();
  var totB=cats.reduce(function(a,c){return a+catBudget(c);},0);
  var totS=cats.reduce(function(a,c){return a+catSpent(c,sp);},0);
  var unalloc=totI-totB;
  var budgetLeft=totB-totS;
  // Categories with spending
  var catDetails=[];
  cats.forEach(function(c){
    var budgeted=catBudget(c),spent=catSpent(c,sp);
    if(budgeted>0||spent>0){
      catDetails.push(c.name+": budgeted "+fmt(budgeted)+", spent "+fmt(spent)+", left "+fmt(budgeted-spent));
    }
    (c.subs||[]).forEach(function(s){
      var sb=Number(D.budgets[s.id])||0,ss=sp[s.id]||0;
      if(sb>0||ss>0)catDetails.push("  - "+s.name+": budgeted "+fmt(sb)+", spent "+fmt(ss)+", left "+fmt(sb-ss));
    });
  });
  // Debts
  var debtDetails=D.debts.map(function(d){
    var rem=Number(d.total)-Number(d.paid||0);
    var mo=Number(d.monthly)||0;
    return d.name+": "+fmt(rem)+" remaining"+(d.rate?" at "+d.rate+"% APR":"")+( mo?" paying "+fmt(mo)+"/mo":"");
  });
  // Goals
  var goalDetails=D.goals.map(function(g){
    var pct=Number(g.target)>0?Math.round((Number(g.saved||0)/Number(g.target))*100):0;
    return g.name+": "+fmt(g.saved||0)+" saved of "+fmt(g.target)+" target ("+pct+"%)";
  });
  // Recent transactions
  var recentTx=D.transactions.filter(function(t){return t.month===D.month&&!t.isTransferIn;}).slice(0,10).map(function(t){return t.name+" "+fmt(t.amount)+" ("+t.category+")";});
  // Recurring
  var recDetails=D.recurring.map(function(r){return r.name+" "+fmt(r.amount)+" "+r.freq;});

  var nl="\n";
  return "CURRENT MONTH: "+D.month+nl+
    "Monthly Income: "+fmt(totI)+nl+
    "Total Budgeted: "+fmt(totB)+nl+
    "Total Spent So Far: "+fmt(totS)+nl+
    "Budget Remaining: "+fmt(budgetLeft)+nl+
    "Unallocated (Free): "+fmt(unalloc)+nl+nl+
    "BUDGET BY CATEGORY:"+nl+catDetails.join(nl)+nl+nl+
    (debtDetails.length?"DEBTS:"+nl+debtDetails.join(nl)+nl+nl:"")+
    (goalDetails.length?"SAVINGS GOALS:"+nl+goalDetails.join(nl)+nl+nl:"")+
    (recDetails.length?"RECURRING PAYMENTS:"+nl+recDetails.join(nl)+nl+nl:"")+
    (recentTx.length?"RECENT TRANSACTIONS THIS MONTH:"+nl+recentTx.join(nl)+nl+nl:"");
}

async function runAdvisor(){
  patch({advisorLoading:true,advisorText:""});
  var summary=buildFinancialSummary();
  var sysMsg=[
    "You are a friendly practical personal financial advisor.",
    "The user uses a zero-based budgeting app called Quarterly with a cash envelope and jar savings system.",
    "They are actively paying off debts and building savings.",
    "Analyze their financial data and give specific actionable advice using their actual numbers.",
    "Cover: 1) What they are doing well 2) Where to cut or adjust spending 3) Best use of free money",
    "4) Which debt to pay first and why 5) Savings recommendations.",
    "Be conversational encouraging and direct. Use bullet points. Keep it practical not overwhelming."
  ].join(" ");
  var prompt=sysMsg+" Here is their financial data: "+summary;
  try{
    var resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:prompt}]
      })
    });
    var data=await resp.json();
    var text=data.content&&data.content[0]?data.content[0].text:"Sorry, I could not analyze your data right now.";
    patch({advisorLoading:false,advisorText:text});
  }catch(e){
    patch({advisorLoading:false,advisorText:"Could not connect to AI advisor. Please try again."});
  }
}

function exportData(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  var d=new Date();
  a.download="quarterly-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Backup saved!");
}

function importData(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!imported.categories&&!imported.transactions){showToast("Invalid backup file","#f87171");return;}
      Object.assign(D,imported);
      saveD(D);
      render();
      showToast("Backup restored!");
    }catch(err){showToast("Could not read file","#f87171");}
  };
  reader.readAsText(file);
}
