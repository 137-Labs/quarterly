<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080810"/>
<title>Quarterly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810;
  --bg2:#0e0e1c;
  --bg3:#141428;
  --bg4:#1a1a32;
  --surface:#1e1e36;
  --border:#ffffff06;
  --border2:#ffffff0c;
  --border3:#ffffff14;
  --violet:#7c6dfa;
  --violet2:#a78bfa;
  --green:#4ade80;
  --green2:#22c55e;
  --blue:#60a5fa;
  --amber:#facc15;
  --orange:#fb923c;
  --red:#f87171;
  --teal:#2dd4bf;
  --pink:#f472b6;
  --text:#f0eeff;
  --text2:#9490b8;
  --text3:#4a4870;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column;position:fixed;width:100%;top:0;left:0}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 14px 24px;min-height:0}
.tc::-webkit-scrollbar{width:2px}
.tc::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px}
input,select,button,textarea{font-family:var(--font);-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=month]::-webkit-calendar-picker-indicator{filter:invert(0.3)}

/* Inputs */
.inp{background:var(--bg3);border:1.5px solid var(--border2);border-radius:11px;padding:10px 13px;color:var(--text);font-size:13px;outline:none;width:100%;transition:border-color .2s}
.inp:focus{border-color:#7c6dfa44;background:var(--bg4)}
select.inp{cursor:pointer}

/* Labels */
.lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:600;font-family:var(--mono)}

/* Cards */
.card{background:var(--bg2);border:1.5px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 0 0 #ffffff04 inset}
.card2{background:var(--bg3);border:1.5px solid var(--border2);border-radius:14px;padding:11px 13px;margin-bottom:8px}

/* Pills */
.pill{display:inline-flex;align-items:center;border-radius:100px;padding:2px 8px;font-size:9px;font-weight:700;border:1px solid;font-family:var(--mono);letter-spacing:.04em}

/* Progress */
.pt{background:var(--bg4);border-radius:100px;overflow:hidden}
.pb{height:100%;border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* Modal */
.mbg{position:fixed;inset:0;background:#000000cc;z-index:500;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1.5px solid var(--border2);border-top:1.5px solid var(--border3);border-radius:22px 22px 0 0;padding:20px 18px 40px;width:100%;max-width:600px;max-height:87vh;overflow-y:auto}
.modal-drag{width:36px;height:3px;background:var(--border3);border-radius:2px;margin:0 auto 18px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mh h3{font-size:16px;font-weight:700;color:var(--text)}
.mh button{background:var(--bg3);border:1.5px solid var(--border2);color:var(--text3);cursor:pointer;font-size:11px;padding:5px 9px;border-radius:8px;line-height:1}

/* Rows */
.row{display:flex;align-items:center;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{margin-bottom:12px}

/* Header */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border2);padding:10px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}

/* Stats bar */
.sbar{background:var(--bg);border-bottom:1px solid var(--border2);padding:8px 12px;flex-shrink:0;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sbar::-webkit-scrollbar{display:none}
.sp{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:6px 10px;flex-shrink:0}
.sp .sv{font-size:13px;font-weight:700;font-family:var(--mono)}

/* Tabs */
.tabs{background:var(--bg);border-bottom:1px solid var(--border2);display:flex;flex-shrink:0;padding:0 8px}
.tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text3);padding:9px 4px 7px;cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;margin-bottom:-1px;white-space:nowrap;font-family:var(--font)}
.tab.on{font-weight:700}

/* Segments */
.seg{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;background:var(--bg2);border:1px solid var(--border2);border-radius:13px;padding:3px}
.seg::-webkit-scrollbar{display:none}
.segb{flex-shrink:0;background:transparent;border:none;border-radius:10px;padding:6px 12px;color:var(--text3);cursor:pointer;font-size:11px;font-weight:500;font-family:var(--font);transition:all .15s}
.segb.on{font-weight:700;box-shadow:0 1px 0 #ffffff08 inset}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1.5px solid var(--border3);border-radius:100px;padding:10px 20px;font-size:12px;font-weight:600;color:var(--text);z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 4px 24px #00000060}

/* Tx/rec rows */
.txrow{background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;padding:8px 11px;display:flex;align-items:center;gap:9px;margin-bottom:5px;transition:border-color .15s}
.txrow:hover{border-color:var(--border3)}
.recrow{background:var(--bg3);border:1px solid #7c6dfa14;border-radius:12px;padding:8px 11px;display:flex;align-items:center;gap:9px;margin-bottom:5px}

/* Misc */
.dbtn{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--text3);cursor:pointer;font-size:10px;padding:3px 8px;flex-shrink:0;font-family:var(--font)}
.dbtn:hover{border-color:var(--border3);color:var(--text2)}
.er{background:var(--bg3);border:1.5px solid var(--border2);border-radius:14px;padding:14px;margin-bottom:8px}
.er .fld{margin-bottom:9px}

/* Icon badge */
.ibadge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var APP_VER="quarterly-v11";
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function tod(){return new Date().toISOString().slice(0,10)}
function thisMo(){return new Date().toISOString().slice(0,7)}
function fmt(n){return"€"+Number(n||0).toFixed(2)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cl(s){return s?String(s).replace(/'/g,"\\'"):""}

function showToast(msg,color){
  var t=document.getElementById("toast");
  t.textContent=msg;t.style.background=color?"#1e1e36":"var(--bg4)";
  t.style.color=color||"var(--text)";
  t.style.borderColor=color?color+"44":"var(--border3)";
  t.style.opacity="1";
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.style.opacity="0"},2400);
}

function saveD(){try{localStorage.setItem("qly_data",JSON.stringify(D));}catch(e){}}
function loadD(){try{var s=localStorage.getItem("qly_data");return s?JSON.parse(s):null;}catch(e){return null;}}

function sanitize(d){
  if(!d)return d;
  d.income=Number(d.income)||0;
  if(!Array.isArray(d.debts))d.debts=[];
  if(!Array.isArray(d.goals))d.goals=[];
  if(!Array.isArray(d.transactions))d.transactions=[];
  if(!Array.isArray(d.recurring))d.recurring=[];
  if(!Array.isArray(d.incomeStreams))d.incomeStreams=[];
  if(!Array.isArray(d.oneTimeIncome))d.oneTimeIncome=[];
  if(!Array.isArray(d.rerouteRules))d.rerouteRules=[];
  if(!d.monthOverrides||typeof d.monthOverrides!=="object")d.monthOverrides={};
  if(!d.budgets||typeof d.budgets!=="object")d.budgets={};
  if(!Array.isArray(d.categories)||d.categories.length===0)d.categories=defCats();
  if(!d.month)d.month=thisMo();
  d.debts.forEach(function(x){x.total=Number(x.total)||0;x.paid=Number(x.paid)||0;x.rate=Number(x.rate)||0;x.monthly=Number(x.monthly)||0;});
  d.goals.forEach(function(x){x.target=Number(x.target)||0;x.saved=Number(x.saved)||0;});
  d.transactions.forEach(function(x){x.amount=Number(x.amount)||0;});
  d.recurring.forEach(function(x){x.amount=Number(x.amount)||0;x.day=Number(x.day)||1;});
  d.incomeStreams.forEach(function(x){x.amount=Number(x.amount)||0;x.day=Number(x.day)||1;});
  d.oneTimeIncome.forEach(function(x){x.amount=Number(x.amount)||0;});
  d.appVersion=APP_VER;
  return d;
}

function defCats(){
  return[
    {id:"housing",name:"Housing",icon:"🏠",color:"#60a5fa",subs:[{id:"hrent",name:"Rent",icon:"🏠"},{id:"hins",name:"Insurance",icon:"🛡️"}]},
    {id:"food",name:"Food",icon:"🍽️",color:"#4ade80",subs:[{id:"fgroc",name:"Groceries",icon:"🛒"},{id:"frest",name:"Restaurants",icon:"🍕"}]},
    {id:"transport",name:"Transport",icon:"🚗",color:"#facc15",subs:[{id:"tfuel",name:"Fuel",icon:"⛽"},{id:"tpub",name:"Public Transit",icon:"🚌"}]},
    {id:"utilities",name:"Utilities",icon:"⚡",color:"#f87171",subs:[{id:"uelec",name:"Electric",icon:"💡"},{id:"unet",name:"Internet",icon:"📶"}]},
    {id:"personal",name:"Personal",icon:"🧘",color:"#a78bfa",subs:[{id:"phair",name:"Haircut",icon:"💇"},{id:"ppkt",name:"Pocket Money",icon:"💵"}]},
    {id:"savings",name:"Savings",icon:"💰",color:"#2dd4bf",subs:[{id:"sjar",name:"Money Jar",icon:"🏦"}]},
    {id:"debt",name:"Debt Payments",icon:"💳",color:"#fb923c",subs:[]},
    {id:"other",name:"Other",icon:"📦",color:"#94a3b8",subs:[]}
  ];
}
function defBudgets(cats){
  var b={};
  (cats||[]).forEach(function(c){b[c.id]=0;(c.subs||[]).forEach(function(s){b[s.id]=0;});});
  return b;
}

var _loaded=loadD();
var D=sanitize(_loaded)||sanitize({income:0,budgets:{},transactions:[],goals:[],debts:[],recurring:[],incomeStreams:[],oneTimeIncome:[],monthOverrides:{},month:thisMo(),categories:defCats()});
if(!D.budgets||Object.keys(D.budgets).length===0)D.budgets=defBudgets(D.categories);

var S={
  tab:"home",seg:"income",
  showTx:false,showGoal:false,showDebt:false,showRec:false,
  editTx:null,editStream:null,editRec:null,editDebt:null,editGoal:null,editCat:null,
  showBackupMenu:false,showAdvisor:false,
  advisorMsgs:[],advisorLoading:false,advisorInput:"",
  debtStrat:"avalanche",showPayoff:false,showNetWorth:false,
  showAddStream:false,collapsed:{},movePanel:null,mvType:"cat"
};

function streamMonthly(s){
  var a=Number(s.amount)||0,f=s.freq;
  if(f==="weekly")return a*4.33;
  if(f==="biweekly")return a*2.17;
  if(f==="yearly")return a/12;
  return a;
}
function totalIncome(){
  if(D.monthOverrides[D.month]&&D.monthOverrides[D.month].income!=null)return Number(D.monthOverrides[D.month].income);
  var base=D.income||0;
  var streams=D.incomeStreams.reduce(function(a,s){return a+streamMonthly(s);},0);
  var oti=(D.oneTimeIncome||[]).filter(function(t){return t.month===D.month;}).reduce(function(a,t){return a+Number(t.amount);},0);
  return base+streams+oti;
}
function totBudget(){return Object.values(D.budgets).reduce(function(a,v){return a+Number(v||0);},0);}
function catSpent(cat,sp){
  var ids=[cat.id].concat((cat.subs||[]).map(function(s){return s.id;}));
  return ids.reduce(function(a,id){return a+(sp[id]||0);},0);
}
function spentBycat(){
  var sp={};
  D.transactions.filter(function(t){return t.month===D.month;}).forEach(function(t){
    if(!t.category)return;
    sp[t.category]=(sp[t.category]||0)+Number(t.amount||0);
  });
  return sp;
}
function txOpts(){
  var opts=[];
  (D.categories||[]).forEach(function(c){
    opts.push({id:c.id,name:c.name,icon:c.icon||"📦",color:c.color||"#94a3b8",isParent:true});
    (c.subs||[]).forEach(function(s){opts.push({id:s.id,name:s.name,icon:s.icon||"📦",color:c.color||"#94a3b8"});});
  });
  return opts;
}
function optById(id){
  var opts=txOpts();
  for(var i=0;i<opts.length;i++){if(opts[i].id===id)return opts[i];}
  return{id:id,name:id,icon:"📦",color:"#94a3b8"};
}
function catOptsHTML(sel){
  var h="";
  (D.categories||[]).forEach(function(c){
    h+='<option value="'+esc(c.id)+'"'+(sel===c.id?" selected":"")+'>'+esc(c.icon)+" "+esc(c.name)+'</option>';
    (c.subs||[]).forEach(function(s){h+='<option value="'+esc(s.id)+'"'+(sel===s.id?" selected":"")+'>  └ '+esc(s.icon)+" "+esc(s.name)+'</option>';});
  });
  return h;
}
function calcPayoffOrder(strat){
  var debts=D.debts.map(function(d){return{id:d.id,name:d.name,remaining:d.total-d.paid,rate:d.rate||0,monthly:d.monthly||0};}).filter(function(d){return d.remaining>0;});
  if(strat==="avalanche")debts.sort(function(a,b){return b.rate-a.rate;});
  else debts.sort(function(a,b){return a.remaining-b.remaining;});
  return debts;
}
function calcPayoffMonths(remaining,rate,monthly){
  if(!monthly||monthly<=0)return null;
  if(!rate||rate<=0)return Math.ceil(remaining/monthly);
  var r=rate/100/12;
  if(monthly<=remaining*r)return null;
  return Math.ceil(Math.log(monthly/(monthly-remaining*r))/Math.log(1+r));
}

function patch(obj){Object.assign(S,obj);render();}
function render(){var el=document.getElementById("app");if(!el)return;el.innerHTML=buildApp();bindEv();}
function bindEv(){
  var mp=document.getElementById("mpick");
  if(mp)mp.addEventListener("change",function(e){
    var oldMo=D.month;D.month=e.target.value;
    if(D.month!==oldMo&&D.rerouteRules&&D.rerouteRules.length>0){applyRerouteRules();showToast(D.rerouteRules.length+" reroute(s) applied");}
    saveD();render();
  });
  if(S.showBackupMenu){
    setTimeout(function(){
      function dismiss(e){if(!e.target.closest||!e.target.closest("[data-bmenu]")){S.showBackupMenu=false;render();document.removeEventListener("click",dismiss);}}
      document.addEventListener("click",dismiss);
    },50);
  }
  if(S.showAdvisor){
    setTimeout(function(){
      var el=document.getElementById("adv-msgs");if(el)el.scrollTop=el.scrollHeight;
      var inp=document.getElementById("adv-inp");
      if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();var v=inp.value.trim();if(v)sendAdvisor(v);}});
    },50);
  }
}

function buildApp(){
  var cats=D.categories||defCats();
  var sp=spentBycat();
  var totB=totBudget();
  var totS=cats.reduce(function(a,c){return a+catSpent(c,sp);},0);
  var totI=totalIncome();
  var free=totI-totB;

  // Header
  var h='<div class="hdr">';
  h+='<div style="display:flex;align-items:center;gap:9px">';
  h+='<div style="width:30px;height:30px;background:linear-gradient(135deg,#7c6dfa,#4ade80);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px">💸</div>';
  h+='<div>';
  h+='<div style="font-size:15px;font-weight:700;letter-spacing:-.02em"><span style="color:var(--violet2)">Quarter</span><span style="color:var(--text)">ly</span></div>';
  h+='</div>';
  h+='<div style="position:relative;margin-left:2px">';
  h+='<input type="month" id="mpick" value="'+esc(D.month)+'" style="background:var(--bg3);border:1.5px solid var(--border2);border-radius:9px;padding:5px 8px;color:var(--text2);font-size:11px;font-weight:500;font-family:var(--mono);outline:none;width:108px"/>';
  h+='</div></div>';
  h+='<div style="display:flex;align-items:center;gap:5px">';

  // Backup dropdown
  h+='<div style="position:relative" data-bmenu="1">';
  h+='<button onclick="patch({showBackupMenu:!S.showBackupMenu})" style="background:var(--bg3);border:1.5px solid var(--border2);border-radius:9px;padding:6px 9px;color:var(--amber);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:2px;line-height:1">💾<span style="font-size:8px;color:var(--text3)">▾</span></button>';
  if(S.showBackupMenu){
    h+='<div data-bmenu="1" style="position:absolute;top:calc(100% + 5px);right:0;background:var(--bg4);border:1.5px solid var(--border3);border-radius:13px;overflow:hidden;z-index:300;min-width:148px;box-shadow:0 12px 40px #00000080">';
    h+='<button onclick="doExport();patch({showBackupMenu:false})" style="width:100%;background:none;border:none;padding:11px 14px;text-align:left;color:var(--amber);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px">💾 Save Backup</button>';
    h+='<div style="height:1px;background:var(--border2)"></div>';
    h+='<label data-bmenu="1" style="width:100%;display:flex;align-items:center;gap:8px;padding:11px 14px;color:var(--blue);cursor:pointer;font-size:12px">📂 Load Backup<input type="file" accept=".json" onchange="doImport(event)" style="display:none"/></label>';
    h+='</div>';
  }
  h+='</div>';

  h+='<label style="background:var(--bg3);border:1.5px solid #f8717120;border-radius:9px;padding:6px 9px;color:var(--red);cursor:pointer;font-size:12px;display:flex;align-items:center;line-height:1" title="Import Debt PDF">📋<input type="file" accept=".pdf" onchange="doImportPDF(event)" style="display:none"/></label>';
  h+='<button onclick="openAdvisor()" style="background:var(--bg3);border:1.5px solid #a78bfa20;border-radius:9px;padding:6px 9px;color:var(--violet2);cursor:pointer;font-size:12px;line-height:1">🧠</button>';
  h+='</div></div>';

  // Stats bar
  h+='<div class="sbar">';
  h+=sp2("Income",fmt(totI),"var(--green)");
  h+='<div style="width:1px;height:20px;background:var(--border2);flex-shrink:0"></div>';
  h+=sp2("Budget",fmt(totB),"var(--blue)");
  h+=sp2("Spent",fmt(totS),"var(--orange)");
  h+=sp2("Free",fmt(free),free<0?"var(--red)":"var(--green)");
  h+=sp2("Left",fmt(totB-totS),"var(--violet2)");
  h+='</div>';

  // Tabs
  var tabs=[["home","📊 Home"],["budget","💰 Budget"],["pay","💳 Pay"],["money","⚡ Money"]];
  var tcols={home:"var(--violet2)",budget:"var(--green)",pay:"var(--blue)",money:"var(--amber)"};
  h+='<div class="tabs">';
  tabs.forEach(function(t){
    var a=S.tab===t[0];
    h+='<button class="tab'+(a?" on":"")+'" onclick="patch({tab:\''+t[0]+'\'})" style="color:'+(a?tcols[t[0]]:"var(--text3)")+';border-bottom-color:'+(a?tcols[t[0]]:"transparent")+'">'+t[1]+'</button>';
  });
  h+='</div>';

  h+='<div class="tc">';
  if(S.tab==="home")h+=tabHome(cats,sp,totB,totS,totI,free);
  else if(S.tab==="budget")h+=tabBudget(cats,sp,free);
  else if(S.tab==="pay")h+=tabPay();
  else if(S.tab==="money")h+=tabMoney(totI,cats,totI,totB);
  h+='</div>';

  if(S.showTx)h+=modalTx();
  if(S.showGoal)h+=modalGoal();
  if(S.showDebt)h+=modalDebt();
  if(S.showRec)h+=modalRec();
  if(S.showAdvisor)h+=modalAdvisor();
  return h;
}

function sp2(l,v,c){
  return'<div class="sp"><div class="lbl">'+l+'</div><div class="sv" style="color:'+c+'">'+v+'</div></div>';
}

// ── HOME TAB ──────────────────────────────────────────────
function tabHome(cats,sp,totB,totS,totI,free){
  var h="";
  var score=100;
  if(free<0)score-=30;else if(free<totI*0.1)score-=15;
  var totDebtR=D.debts.reduce(function(a,d){return a+(d.total-d.paid);},0);
  if(totDebtR>totI*6)score-=20;else if(totDebtR>totI*3)score-=10;
  var pct=totB>0?totS/totB:0;
  if(pct>1)score-=20;else if(pct>0.9)score-=10;
  score=Math.max(0,Math.min(100,score));
  var scol=score>=80?"var(--green)":score>=60?"var(--amber)":"var(--red)";
  var slbl=score>=80?"On Track":score>=60?"Doing OK":"Needs Attention";
  var txCount=D.transactions.filter(function(t){return t.month===D.month;}).length;

  // Health card
  h+='<div class="card" style="border-color:'+(score>=80?"#4ade8020":score>=60?"#facc1520":"#f8717120")+';">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
  h+='<div>';
  h+='<div class="lbl" style="margin-bottom:6px">Financial Health · '+D.month+'</div>';
  h+='<div style="font-size:44px;font-weight:800;color:'+scol+';letter-spacing:-.04em;line-height:1;font-family:var(--mono)">'+score+'</div>';
  h+='<div style="font-size:11px;color:'+scol+';margin-top:5px;font-weight:500">'+slbl+'</div>';
  h+='</div>';
  h+='<div style="text-align:right">';
  h+='<div style="width:52px;height:52px;border-radius:14px;background:'+scol+';display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 24px '+(score>=80?"#4ade8040":score>=60?"#facc1540":"#f8717140")+';">'+(score>=80?"😊":score>=60?"😐":"😟")+'</div>';
  h+='<div style="font-size:10px;color:var(--text3);margin-top:6px;font-family:var(--mono)">'+txCount+' payments</div>';
  h+='</div></div></div>';

  // Stat grid
  h+='<div class="row2" style="margin-bottom:10px">';
  h+=dashCard("💰","Free Money",fmt(free),free<0?"var(--red)":"var(--green)","Available this month");
  h+=dashCard("📊","Budget Used",Math.round(pct*100)+"%","var(--blue)",fmt(totS)+" of "+fmt(totB));
  h+=dashCard("💳","Total Debt",fmt(totDebtR),"var(--red)",D.debts.length+" tracked");
  h+=dashCard("🏦","Saved",fmt(D.goals.reduce(function(a,g){return a+g.saved;},0)),"var(--teal)",D.goals.length+" goals");
  h+='</div>';

  // Category breakdown
  if(cats.length>0){
    h+='<div class="card" style="margin-bottom:10px">';
    h+='<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">Categories</div>';
    cats.forEach(function(cat){
      var bgt=Number(D.budgets[cat.id]||0);
      (cat.subs||[]).forEach(function(s){bgt+=Number(D.budgets[s.id]||0);});
      var spent=catSpent(cat,sp);
      var p=bgt>0?Math.min(spent/bgt*100,100):0;
      var col=p>100?"var(--red)":p>80?"var(--amber)":"var(--green)";
      if(bgt===0&&spent===0)return;
      h+='<div style="margin-bottom:10px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
      h+='<div style="display:flex;align-items:center;gap:6px"><span style="font-size:13px">'+esc(cat.icon)+'</span><span style="font-size:12px;font-weight:600;color:var(--text)">'+esc(cat.name)+'</span></div>';
      h+='<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">'+fmt(spent)+' / '+fmt(bgt)+'</span>';
      h+='</div>';
      h+='<div class="pt" style="height:3px"><div class="pb" style="width:'+p+'%;background:'+col+'"></div></div>';
      h+='</div>';
    });
    h+='</div>';
  }

  // Bill buffer
  var mbills=D.recurring.reduce(function(a,r){var amt=Number(r.amount||0);if(r.freq==="weekly")return a+amt*4.33;if(r.freq==="biweekly")return a+amt*2.17;if(r.freq==="yearly")return a+amt/12;return a+amt;},0);
  var bufG=D.goals.filter(function(g){return g.isBuffer;})[0];
  var bufSaved=bufG?bufG.saved:0;
  var buf1=mbills,buf3=mbills*3;
  var bp1=buf1>0?Math.min(bufSaved/buf1*100,100):0;
  var bp3=buf3>0?Math.min(bufSaved/buf3*100,100):0;
  var bcol=bufSaved>=buf3?"var(--green)":bufSaved>=buf1?"var(--amber)":"var(--blue)";
  var bstat=bufSaved>=buf3?"Bulletproof":bufSaved>=buf1?"Safe":"Building";
  if(mbills>0||bufG){
    h+='<div class="card" style="border-color:'+(bufSaved>=buf3?"#4ade8018":bufSaved>=buf1?"#facc1518":"#60a5fa18")+';margin-bottom:10px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
    h+='<div style="display:flex;align-items:center;gap:7px"><span style="font-size:16px">🛡️</span><span style="font-size:13px;font-weight:700">Bill Buffer</span>';
    h+='<span class="pill" style="color:'+bcol+';border-color:'+bcol+';background:'+bcol.replace("var(","").replace(")","")+'14">'+bstat+'</span></div>';
    h+='<span style="font-size:14px;font-weight:700;color:'+bcol+';font-family:var(--mono)">'+fmt(bufSaved)+'</span></div>';
    h+='<div class="lbl" style="margin-bottom:3px">1 month · '+fmt(buf1)+'</div>';
    h+='<div class="pt" style="height:4px;margin-bottom:8px"><div class="pb" style="width:'+bp1+'%;background:'+bcol+'"></div></div>';
    h+='<div class="lbl" style="margin-bottom:3px">3 months bulletproof · '+fmt(buf3)+'</div>';
    h+='<div class="pt" style="height:3px;margin-bottom:8px"><div class="pb" style="width:'+bp3+'%;background:'+bcol+';opacity:.5"></div></div>';
    h+='<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">'+D.recurring.length+' bills · '+fmt(mbills)+'/mo</div>';
    if(!bufG){h+='<button onclick="makeBufferGoal()" style="width:100%;background:'+bcol+'12;border:1.5px solid '+bcol+'25;border-radius:10px;padding:9px;color:'+bcol+';cursor:pointer;font-size:12px;font-weight:600;margin-top:10px">+ Start Building Buffer</button>';}
    h+='</div>';
  }

  // Net worth
  var assets=D.goals.reduce(function(a,g){return a+g.saved;},0);
  var liabs=D.debts.reduce(function(a,d){return a+(d.total-d.paid);},0);
  var nw=assets-liabs;
  h+='<div class="card" style="margin-bottom:10px">';
  h+='<button onclick="patch({showNetWorth:!S.showNetWorth})" style="width:100%;background:none;border:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:0">';
  h+='<div style="display:flex;align-items:center;gap:6px"><span>📊</span><span style="font-size:13px;font-weight:700;color:var(--text)">Net Worth</span></div>';
  h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;font-weight:700;color:'+(nw>=0?"var(--green)":"var(--red)")+';font-family:var(--mono)">'+fmt(nw)+'</span><span style="color:var(--text3);font-size:11px">'+(S.showNetWorth?"▲":"▼")+'</span></div>';
  h+='</button>';
  if(S.showNetWorth){
    h+='<div style="border-top:1px solid var(--border2);margin-top:12px;padding-top:12px">';
    h+='<div class="row2" style="margin-bottom:10px">';
    h+='<div style="background:#4ade8010;border:1.5px solid #4ade8018;border-radius:11px;padding:10px"><div class="lbl">Assets</div><div style="font-size:15px;font-weight:700;color:var(--green)">'+fmt(assets)+'</div></div>';
    h+='<div style="background:#f8717110;border:1.5px solid #f8717118;border-radius:11px;padding:10px"><div class="lbl">Liabilities</div><div style="font-size:15px;font-weight:700;color:var(--red)">'+fmt(liabs)+'</div></div>';
    h+='</div>';
    D.goals.forEach(function(g){h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px;color:var(--text2)">'+g.icon+' '+esc(g.name)+'</span><span style="font-size:11px;color:var(--green);font-family:var(--mono)">'+fmt(g.saved)+'</span></div>';});
    D.debts.forEach(function(d){h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px;color:var(--text2)">💳 '+esc(d.name)+'</span><span style="font-size:11px;color:var(--red);font-family:var(--mono)">-'+fmt(d.total-d.paid)+'</span></div>';});
    h+='<div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:1px solid var(--border2)"><span style="font-size:12px;font-weight:700;color:var(--text)">Net Worth</span><span style="font-size:14px;font-weight:700;color:'+(nw>=0?"var(--green)":"var(--red)")+';font-family:var(--mono)">'+fmt(nw)+'</span></div>';
    h+='</div>';
  }
  h+='</div>';

  // Upcoming bills
  var today=new Date().getDate();
  var upcoming=D.recurring.filter(function(r){return Number(r.day)>=today;}).sort(function(a,b){return Number(a.day)-Number(b.day);}).slice(0,4);
  if(upcoming.length>0){
    h+='<div class="card"><div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">📅 Upcoming</div>';
    upcoming.forEach(function(r){
      var daysLeft=Number(r.day)-today;
      h+='<div style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--border)">';
      h+='<div style="width:30px;height:30px;border-radius:9px;background:var(--bg3);border:1.5px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">';
      h+='<span style="font-size:10px;font-weight:800;color:var(--violet2);font-family:var(--mono);line-height:1">'+r.day+'</span>';
      h+='</div>';
      h+='<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--text)">'+esc(r.name)+'</div>';
      h+='<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">'+(daysLeft===0?"Today":daysLeft===1?"Tomorrow":daysLeft+" days")+'</div></div>';
      h+='<div style="font-size:12px;font-weight:700;color:var(--violet2);font-family:var(--mono)">'+fmt(r.amount)+'</div></div>';
    });
    h+='</div>';
  }
  return h;
}

function dashCard(icon,label,val,col,sub){
  return'<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:12px"><div style="font-size:18px;margin-bottom:6px">'+icon+'</div><div class="lbl">'+label+'</div><div style="font-size:16px;font-weight:700;color:'+col+';font-family:var(--mono)">'+val+'</div><div style="font-size:10px;color:var(--text3);margin-top:3px">'+sub+'</div></div>';
}
function makeBufferGoal(){
  var mbills=D.recurring.reduce(function(a,r){var amt=Number(r.amount||0);if(r.freq==="weekly")return a+amt*4.33;if(r.freq==="biweekly")return a+amt*2.17;if(r.freq==="yearly")return a+amt/12;return a+amt;},0);
  D.goals.push({id:uid(),name:"Bill Buffer",icon:"🛡️",target:Math.round(mbills*3),saved:0,isBuffer:true});
  saveD();showToast("Buffer goal created!");patch({tab:"money",seg:"progress"});
}

// ── BUDGET TAB ────────────────────────────────────────────
function tabBudget(cats,sp,free){
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<div style="font-size:12px;color:'+(free<0?"var(--red)":"var(--green)")+';font-weight:600">'+(free<0?"⚠ Over by "+fmt(-free):"✓ "+fmt(free)+" free")+'</div>';
  h+='<button onclick="patch({editCat:\'new\'})" style="background:var(--bg3);border:1.5px solid #4ade8030;border-radius:9px;padding:6px 12px;color:var(--green);cursor:pointer;font-size:11px;font-weight:600">+ Category</button>';
  h+='</div>';
  cats.forEach(function(cat){h+=catCard(cat,sp);});
  if(S.editCat){h+=modalCat();}
  return h;
}

function catCard(cat,sp){
  var totBgt=Number(D.budgets[cat.id]||0);
  (cat.subs||[]).forEach(function(s){totBgt+=Number(D.budgets[s.id]||0);});
  var totSpent=catSpent(cat,sp);
  var pct=totBgt>0?Math.min(totSpent/totBgt*100,100):0;
  var col=pct>=100?"var(--red)":pct>=80?"var(--amber)":"var(--green)";
  var isOpen=!S.collapsed||!S.collapsed[cat.id];
  var showMove=S.movePanel===cat.id;
  var rules=(D.rerouteRules||[]).filter(function(r){return r.fromId===cat.id;});
  var h='<div class="card2">';
  h+='<div style="display:flex;align-items:center;gap:8px">';
  h+='<div onclick="toggleCat(\''+cl(cat.id)+'\')" style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0">';
  h+='<div class="ibadge" style="background:'+(cat.color||"#94a3b8")+'18">'+esc(cat.icon)+'</div>';
  h+='<div style="flex:1;min-width:0">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--text)">'+esc(cat.name)+'</div>';
  h+='<div class="pt" style="height:3px;margin-top:3px"><div class="pb" style="width:'+pct+'%;background:'+col+'"></div></div>';
  h+='</div>';
  h+='<span style="font-size:11px;color:var(--text3);font-family:var(--mono);flex-shrink:0">'+fmt(totSpent)+'/'+fmt(totBgt)+'</span>';
  h+='<span style="color:var(--text3);font-size:10px">'+(isOpen?"▲":"▼")+'</span>';
  h+='</div>';
  h+='<button onclick="patch({movePanel:S.movePanel===\''+cl(cat.id)+'\'?null:\''+cl(cat.id)+'\'})" style="background:'+(showMove?"var(--amber)20":"var(--bg4)")+';border:1px solid '+(showMove?"var(--amber)30":"var(--border2)")+';border-radius:7px;color:'+(showMove?"var(--amber)":"var(--text3)")+';cursor:pointer;font-size:11px;padding:4px 7px;flex-shrink:0;font-weight:600">⇄</button>';
  h+='</div>';
  if(rules.length>0){
    h+='<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">';
    rules.forEach(function(rule){
      var destName=rule.destType==="goal"?(D.goals.filter(function(g){return g.id===rule.destId;})[0]||{name:"?"}).name:(D.categories||[]).reduce(function(a,c){if(c.id===rule.destId)return c.name;(c.subs||[]).forEach(function(s){if(s.id===rule.destId)a=s.name;});return a;},"?");
      h+='<div style="display:flex;align-items:center;gap:4px;background:var(--amber)10;border:1px solid var(--amber)20;border-radius:7px;padding:2px 7px">';
      h+='<span style="font-size:10px;color:var(--amber)">↻ '+fmt(rule.amount)+'→ '+esc(destName)+'</span>';
      h+='<button onclick="delReroute(\''+cl(rule.id)+'\')" style="background:none;border:none;color:var(--amber);opacity:.5;cursor:pointer;font-size:11px;padding:0 2px">✕</button>';
      h+='</div>';
    });
    h+='</div>';
  }
  if(showMove){h+=reroutePanel(cat.id);}
  if(isOpen){
    if(cat.subs&&cat.subs.length>0){
      cat.subs.forEach(function(sub){
        var sbgt=Number(D.budgets[sub.id]||0);
        var sspent=sp[sub.id]||0;
        var sp2=sbgt>0?Math.min(sspent/sbgt*100,100):0;
        var sc=sp2>=100?"var(--red)":sp2>=80?"var(--amber)":"var(--green)";
        var showSubMove=S.movePanel===sub.id;
        var subRules=(D.rerouteRules||[]).filter(function(r){return r.fromId===sub.id;});
        h+='<div style="border-top:1px solid var(--border)">';
        h+='<div style="display:flex;align-items:center;gap:6px;padding:6px 0 6px 10px">';
        h+='<span style="font-size:11px">'+esc(sub.icon)+'</span>';
        h+='<span style="flex:1;font-size:11px;color:var(--text2)">'+esc(sub.name)+'</span>';
        h+='<input type="number" value="'+sbgt+'" style="width:72px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 8px;color:var(--text);font-size:11px;outline:none;text-align:right;font-family:var(--mono)" onchange="setBudget(\''+cl(sub.id)+'\',this.value)" onblur="setBudget(\''+cl(sub.id)+'\',this.value)"/>';
        h+='<button onclick="patch({movePanel:S.movePanel===\''+cl(sub.id)+'\'?null:\''+cl(sub.id)+'\'})" style="background:'+(showSubMove?"var(--amber)20":"var(--bg4)")+';border:1px solid '+(showSubMove?"var(--amber)30":"var(--border2)")+';border-radius:6px;color:'+(showSubMove?"var(--amber)":"var(--text3)")+';cursor:pointer;font-size:10px;padding:3px 7px;flex-shrink:0">⇄</button>';
        h+='</div>';
        if(subRules.length>0){
          h+='<div style="display:flex;flex-wrap:wrap;gap:4px;padding:0 0 5px 10px">';
          subRules.forEach(function(rule){
            var destName=rule.destType==="goal"?(D.goals.filter(function(g){return g.id===rule.destId;})[0]||{name:"?"}).name:(D.categories||[]).reduce(function(a,c){if(c.id===rule.destId)return c.name;(c.subs||[]).forEach(function(s){if(s.id===rule.destId)a=s.name;});return a;},"?");
            h+='<div style="display:flex;align-items:center;gap:4px;background:var(--amber)10;border:1px solid var(--amber)20;border-radius:7px;padding:2px 7px">';
            h+='<span style="font-size:10px;color:var(--amber)">↻ '+fmt(rule.amount)+'→'+esc(destName)+'</span>';
            h+='<button onclick="delReroute(\''+cl(rule.id)+'\')" style="background:none;border:none;color:var(--amber);opacity:.5;cursor:pointer;font-size:11px;padding:0 2px">✕</button>';
            h+='</div>';
          });
          h+='</div>';
        }
        if(showSubMove){h+=reroutePanel(sub.id);}
        h+='</div>';
      });
    }else{
      var bgt2=Number(D.budgets[cat.id]||0);
      h+='<div style="display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--border)">';
      h+='<span style="flex:1;font-size:11px;color:var(--text3)">Budget</span>';
      h+='<input type="number" value="'+bgt2+'" style="width:80px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 8px;color:var(--text);font-size:11px;outline:none;text-align:right;font-family:var(--mono)" onchange="setBudget(\''+cl(cat.id)+'\',this.value)" onblur="setBudget(\''+cl(cat.id)+'\',this.value)"/>';
      h+='</div>';
    }
  }
  h+='</div>';
  return h;
}
function toggleCat(id){if(!S.collapsed)S.collapsed={};S.collapsed[id]=!S.collapsed[id];render();}
function setBudget(id,val){D.budgets[id]=Number(val)||0;saveD();render();}
function reroutePanel(fromId){

  h+='<button onclick="patch({mvType:\'cat\'})" style="flex:1;background:'+(mvType==="cat"?"var(--blue)15":"var(--bg3)")+';border:1.5px solid '+(mvType==="cat"?"var(--blue)30":"var(--border2)")+';border-radius:9px;padding:7px;color:'+(mvType==="cat"?"var(--blue)":"var(--text3)")+';cursor:pointer;font-size:11px;font-weight:600">→ Category</button>';
  h+='<button onclick="patch({mvType:\'goal\'})" style="flex:1;background:'+(mvType==="goal"?"var(--teal)15":"var(--bg3)")+';border:1.5px solid '+(mvType==="goal"?"var(--teal)30":"var(--border2)")+';border-radius:9px;padding:7px;color:'+(mvType==="goal"?"var(--teal)":"var(--text3)")+';cursor:pointer;font-size:11px;font-weight:600">→ Goal</button>';
  h+='</div>';
  h+='<div class="fld"><div class="lbl">Send To</div><select id="mv-dest" class="inp" style="font-size:12px">';
  if(mvType==="goal"){D.goals.forEach(function(g){h+='<option value="'+esc(g.id)+'">'+esc(g.icon)+' '+esc(g.name)+'</option>';});if(D.goals.length===0)h+='<option value="">No goals yet</option>';}
  else{(D.categories||[]).forEach(function(c){if(c.id!==fromId)h+='<option value="'+esc(c.id)+'">'+esc(c.icon)+' '+esc(c.name)+'</option>';(c.subs||[]).forEach(function(s){if(s.id!==fromId)h+='<option value="'+esc(s.id)+'">  └ '+esc(s.icon)+' '+esc(s.name)+'</option>';});});}
  h+='</select></div>';
  h+='<div class="row" style="gap:6px">';
  h+='<button onclick="doMoveNow(\''+cl(fromId)+'\')" style="flex:1;background:var(--amber)15;border:1.5px solid var(--amber)30;border-radius:9px;padding:9px;color:var(--amber);cursor:pointer;font-size:12px;font-weight:600">Move Now</button>';
  h+='<button onclick="doMakeRecurring(\''+cl(fromId)+'\')" style="flex:1;background:var(--violet2)15;border:1.5px solid var(--violet2)30;border-radius:9px;padding:9px;color:var(--violet2);cursor:pointer;font-size:12px;font-weight:600">↻ Every Month</button>';
  h+='</div>';
  h+='<div style="font-size:10px;color:var(--text3);margin-top:7px;text-align:center">Move Now is one-time · Every Month auto-applies each month</div>';
  h+='</div>';

function doMoveNow(fromId){
  var amt=Number((document.getElementById("mv-amt")||{}).value)||0;
  var dest=(document.getElementById("mv-dest")||{}).value||"";
  if(!amt||!dest)return showToast("Enter amount and destination","var(--red)");
  var mvType=S.mvType||"cat";
  if(D.budgets[fromId]!==undefined)D.budgets[fromId]=Math.max(0,(D.budgets[fromId]||0)-amt);
  if(mvType==="goal"){
    D.goals=D.goals.map(function(g){return g.id===dest?Object.assign({},g,{saved:g.saved+amt}):g;});
    showToast(fmt(amt)+" moved to goal!");
  }else{D.budgets[dest]=(D.budgets[dest]||0)+amt;showToast(fmt(amt)+" moved!");}
  saveD();patch({movePanel:null});
}
function doMakeRecurring(fromId){
  var amt=Number((document.getElementById("mv-amt")||{}).value)||0;
  var dest=(document.getElementById("mv-dest")||{}).value||"";
  if(!amt||!dest)return showToast("Enter amount and destination","var(--red)");
  if(!D.rerouteRules)D.rerouteRules=[];
  D.rerouteRules.push({id:uid(),fromId:fromId,destId:dest,destType:S.mvType||"cat",amount:amt});
  saveD();patch({movePanel:null});showToast("Auto-reroute set!");
}
function delReroute(id){D.rerouteRules=(D.rerouteRules||[]).filter(function(r){return r.id!==id;});saveD();render();showToast("Reroute removed");}
function applyRerouteRules(){
  (D.rerouteRules||[]).forEach(function(rule){
    if(D.budgets[rule.fromId]!==undefined)D.budgets[rule.fromId]=Math.max(0,(D.budgets[rule.fromId]||0)-rule.amount);
    if(rule.destType==="goal"){D.goals=D.goals.map(function(g){return g.id===rule.destId?Object.assign({},g,{saved:g.saved+rule.amount}):g;});}
    else{D.budgets[rule.destId]=(D.budgets[rule.destId]||0)+rule.amount;}
  });
}

function segForecast(cats,totI,totB){
  var today=new Date();
  var months=[];
  for(var i=0;i<4;i++){
    var mo=new Date(today.getFullYear(),today.getMonth()+i,1).toISOString().slice(0,7);
    months.push(mo);
  }
  var isArchive=D.month<months[0];
  var h='';
  if(isArchive){
    h+='<div style="background:var(--amber)10;border:1.5px solid var(--amber)25;border-radius:12px;padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px">';
    h+='<span>📁</span><div style="flex:1"><div style="font-size:12px;font-weight:600;color:var(--amber)">Viewing archive: '+D.month+'</div>';
    h+='<div style="font-size:10px;color:var(--amber);opacity:.6">Forecast shows your current quarter</div></div>';
    h+='<button onclick="D.month=\''+months[0]+'\';saveD();render()" style="background:var(--amber)15;border:1px solid var(--amber)30;border-radius:8px;padding:5px 10px;color:var(--amber);cursor:pointer;font-size:11px;font-weight:600;flex-shrink:0">Go to Now</button></div>';
  }
  months.forEach(function(mo){
    var mI=D.monthOverrides[mo]&&D.monthOverrides[mo].income!=null?Number(D.monthOverrides[mo].income):totI;
    var recTotal=D.recurring.reduce(function(a,r){var amt=Number(r.amount||0);if(r.freq==="weekly")return a+amt*4.33;if(r.freq==="biweekly")return a+amt*2.17;if(r.freq==="yearly")return a+amt/12;return a+amt;},0);
    var free=mI-totB;
    var isNow=mo===months[0];
    var isSelected=mo===D.month;
    h+='<div class="card" style="margin-bottom:10px;border-color:'+(isNow?"var(--violet2)25":isSelected?"var(--amber)20":"var(--border)")+'">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
    h+='<div style="display:flex;align-items:center;gap:7px"><div style="font-size:13px;font-weight:700;font-family:var(--mono)">'+mo+'</div>';
    if(isNow)h+='<span class="pill" style="color:var(--violet2);border-color:var(--violet2);background:var(--violet2)12">NOW</span>';
    h+='</div>';
    h+='<div style="font-size:13px;font-weight:700;color:'+(free<0?"var(--red)":"var(--green)")+';font-family:var(--mono)">'+fmt(free)+' free</div></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:'+(D.recurring.length>0?"10px":"0")+'">';
    h+='<div style="background:var(--bg3);border-radius:9px;padding:7px;text-align:center"><div class="lbl">Income</div><div style="font-size:11px;font-weight:600;color:var(--green);font-family:var(--mono)">'+fmt(mI)+'</div></div>';
    h+='<div style="background:var(--bg3);border-radius:9px;padding:7px;text-align:center"><div class="lbl">Bills</div><div style="font-size:11px;font-weight:600;color:var(--violet2);font-family:var(--mono)">'+fmt(recTotal)+'</div></div>';
    h+='<div style="background:var(--bg3);border-radius:9px;padding:7px;text-align:center"><div class="lbl">Budget</div><div style="font-size:11px;font-weight:600;color:var(--blue);font-family:var(--mono)">'+fmt(totB)+'</div></div>';
    h+='<div style="background:var(--bg3);border-radius:9px;padding:7px;text-align:center"><div class="lbl">Free</div><div style="font-size:11px;font-weight:600;color:'+(free<0?"var(--red)":"var(--green)")+';font-family:var(--mono)">'+fmt(free)+'</div></div>';
    h+='</div>';
    if(D.recurring.length>0){
      h+='<div style="border-top:1px solid var(--border);padding-top:10px">';
      h+='<div class="lbl" style="margin-bottom:6px">Recurring Payments</div>';
      var sorted=D.recurring.slice().sort(function(a,b){return Number(a.day)-Number(b.day);});
      sorted.forEach(function(r){
        var opt=optById(r.category);
        var alreadyPosted=D.transactions.some(function(t){return t.fromRec&&t.name===r.name&&t.month===mo;});
        h+='<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border)">';
        h+='<div style="width:24px;height:24px;background:var(--violet2)12;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--violet2);flex-shrink:0;font-family:var(--mono)">'+r.day+'</div>';
        h+='<div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.name)+'</div></div>';
        h+='<div style="font-size:11px;font-weight:700;color:var(--violet2);font-family:var(--mono);flex-shrink:0">'+fmt(r.amount)+'</div>';
        if(isNow){
          var alreadySkipped=D.transactions.some(function(t){return t.fromRecSkip&&t.name===r.name&&t.month===mo;});
          if(alreadyPosted){h+='<span style="font-size:10px;color:var(--green);background:var(--green)10;border:1px solid var(--green)20;border-radius:6px;padding:2px 7px;flex-shrink:0">✓ Paid</span>';}
          else if(alreadySkipped){h+='<span style="font-size:10px;color:var(--teal);background:var(--teal)10;border:1px solid var(--teal)20;border-radius:6px;padding:2px 7px;flex-shrink:0">✓ Saved</span>';}
          else{
            h+='<button onclick="postRec(\''+cl(r.id)+'\',\''+mo+'\')" style="background:var(--violet2)12;border:1px solid var(--violet2)25;border-radius:6px;color:var(--violet2);cursor:pointer;font-size:10px;padding:2px 8px;flex-shrink:0;font-weight:600">Post</button>';
            h+='<button onclick="skipRec(\''+cl(r.id)+'\',\''+mo+'\')" style="background:var(--teal)10;border:1px solid var(--teal)25;border-radius:6px;color:var(--teal);cursor:pointer;font-size:10px;padding:2px 8px;flex-shrink:0;font-weight:600">Skip→💰</button>';
          }
        }
        h+='</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  if(D.debts.length>0){
    h+='<div class="card"><div style="font-size:12px;font-weight:700;margin-bottom:10px">💳 Debt Payoff Projection</div>';
    D.debts.forEach(function(d2){
      var rem=d2.total-d2.paid;
      var mo=calcPayoffMonths(rem,d2.rate,d2.monthly);
      h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">';
      h+='<span style="font-size:11px;color:var(--text2)">'+esc(d2.name)+'</span>';
      h+='<span style="font-size:11px;color:var(--red);font-family:var(--mono)">'+(mo?"~"+mo+" months":"add monthly payment")+'</span></div>';
    });
    h+='</div>';
  }
  return h;
}

  var lines=["Month: "+D.month,"Income: "+fmt(totI),"Budgeted: "+fmt(totB),"Spent: "+fmt(totS),"Free: "+fmt(totI-totB)];
  lines.push("Debts ("+D.debts.length+"): "+D.debts.map(function(d){return d.name+" "+fmt(d.total-d.paid)+" remaining";}).join(", ")||"none");
  lines.push("Goals ("+D.goals.length+"): "+D.goals.map(function(g){return g.name+" "+fmt(g.saved)+"/"+fmt(g.target);}).join(", ")||"none");
  lines.push("Recurring bills: "+D.recurring.map(function(r){return r.name+" "+fmt(r.amount);}).join(", ")||"none");
  return lines.join("\n");
}
async function sendAdvisor(msg){
  if(!msg||!msg.trim())return;
  var summary=buildFinancialSummary();
  var sys="You are a friendly personal financial advisor for the Quarterly budgeting app. Give practical, specific advice using the user's actual numbers. Be concise and actionable.\n\nUSER DATA:\n"+summary;
  S.advisorMsgs=S.advisorMsgs.concat([{role:"user",content:msg.trim()}]);
  S.advisorLoading=true;S.advisorInput="";render();
  try{
    var apiMsgs=S.advisorMsgs.map(function(m){return{role:m.role,content:m.content};});
    var resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:sys,messages:apiMsgs})});
    var data=await resp.json();
    var text=data.content&&data.content[0]?data.content[0].text:"Sorry, could not respond right now.";
    S.advisorMsgs=S.advisorMsgs.concat([{role:"assistant",content:text}]);
    S.advisorLoading=false;render();
  }catch(e){
    S.advisorMsgs=S.advisorMsgs.concat([{role:"assistant",content:"Connection error. Please try again."}]);
    S.advisorLoading=false;render();
  }
}

function addTx(){var n=document.getElementById("tx-n"),a=document.getElementById("tx-a"),c=document.getElementById("tx-c"),d=document.getElementById("tx-d");if(!n||!a||!c)return;var name=n.value.trim(),amount=Number(a.value),cat=c.value,date=(d&&d.value)||tod();if(!name||!amount)return showToast("Enter name and amount","var(--red)");var mo=date.slice(0,7);D.transactions.push({id:uid(),name:name,amount:amount,category:cat,date:date,month:mo});saveD();patch({showTx:false,newTx:{name:"",amount:"",category:"",date:tod()}});showToast("Payment added!");}
function delTx(id){D.transactions=D.transactions.filter(function(t){return t.id!==id;});saveD();render();}
function addGoal(){var n=document.getElementById("go-n"),t=document.getElementById("go-t"),s=document.getElementById("go-s"),i=document.getElementById("go-i"),ov=document.getElementById("go-ov");if(!n)return;var name=n.value.trim();if(!name)return showToast("Enter goal name","var(--red)");D.goals.push({id:uid(),name:name,target:Number(t&&t.value)||0,saved:Number(s&&s.value)||0,icon:(i&&i.value)||"🎯",overflowTo:(ov&&ov.value)||""});saveD();patch({showGoal:false});showToast("Goal created!");}
function saveGoal(id){var n=document.getElementById("eg-n"),t=document.getElementById("eg-t"),s=document.getElementById("eg-s"),ov=document.getElementById("eg-ov");if(!n)return;D.goals=D.goals.map(function(g){return g.id===id?Object.assign({},g,{name:n.value.trim(),target:Number(t&&t.value)||0,saved:Number(s&&s.value)||0,overflowTo:(ov&&ov.value)||g.overflowTo||""}):g;});saveD();patch({editGoal:null});}
function delGoal(id){D.goals=D.goals.filter(function(g){return g.id!==id;});saveD();patch({editGoal:null});}
function addToGoal(id,amount){amount=Number(amount)||0;if(!amount)return;D.goals=D.goals.map(function(g){if(g.id!==id)return g;var newSaved=g.saved+amount;var overflow=g.target>0&&newSaved>g.target?newSaved-g.target:0;if(overflow>0&&g.overflowTo){D.goals=D.goals.map(function(g2){if(g2.id!==g.overflowTo)return g2;showToast(fmt(overflow)+" overflow → "+g2.name+"!");return Object.assign({},g2,{saved:g2.saved+overflow});});return Object.assign({},g,{saved:g.target});}if(overflow>0)showToast(g.name+" is full!");return Object.assign({},g,{saved:newSaved});});saveD();render();}
function addDebt(){var n=document.getElementById("dbt-n"),t=document.getElementById("dbt-t"),p=document.getElementById("dbt-p"),r=document.getElementById("dbt-r"),m=document.getElementById("dbt-m");if(!n)return;var name=n.value.trim();if(!name)return showToast("Enter debt name","var(--red)");D.debts.push({id:uid(),name:name,total:Number(t&&t.value)||0,paid:Number(p&&p.value)||0,rate:Number(r&&r.value)||0,monthly:Number(m&&m.value)||0});saveD();patch({showDebt:false});showToast("Debt added!");}
function saveDebt(id){var n=document.getElementById("ed-n"),t=document.getElementById("ed-t"),p=document.getElementById("ed-p"),r=document.getElementById("ed-r"),m=document.getElementById("ed-m");if(!n)return;D.debts=D.debts.map(function(d){return d.id===id?Object.assign({},d,{name:n.value.trim(),total:Number(t&&t.value)||0,paid:Number(p&&p.value)||0,rate:Number(r&&r.value)||0,monthly:Number(m&&m.value)||0}):d;});saveD();patch({editDebt:null});}
function delDebt(id){D.debts=D.debts.filter(function(d){return d.id!==id;});saveD();patch({editDebt:null});}
function quickPay(id,amount){D.debts=D.debts.map(function(d){return d.id===id?Object.assign({},d,{paid:d.paid+Number(amount)}):d;});saveD();render();showToast("Payment recorded!");}
function addRec(){var n=document.getElementById("rc-n"),a=document.getElementById("rc-a"),d=document.getElementById("rc-d"),c=document.getElementById("rc-c"),f=document.getElementById("rc-f");if(!n)return;var name=n.value.trim();if(!name)return showToast("Enter bill name","var(--red)");D.recurring.push({id:uid(),name:name,amount:Number(a&&a.value)||0,day:Number(d&&d.value)||1,category:(c&&c.value)||"other",freq:(f&&f.value)||"monthly"});saveD();patch({showRec:false});showToast("Bill added!");}
function saveRec(id){var n=document.getElementById("er-n"),a=document.getElementById("er-a"),d=document.getElementById("er-d"),c=document.getElementById("er-c"),f=document.getElementById("er-f");if(!n)return;D.recurring=D.recurring.map(function(r){return r.id===id?Object.assign({},r,{name:n.value.trim(),amount:Number(a&&a.value)||0,day:Number(d&&d.value)||1,category:(c&&c.value)||r.category,freq:(f&&f.value)||r.freq}):r;});saveD();patch({editRec:null});}
function delRec(id){D.recurring=D.recurring.filter(function(r){return r.id!==id;});saveD();patch({editRec:null});}
function postRec(id,month){var r=D.recurring.filter(function(r){return r.id===id;})[0];if(!r)return;var mo=month||D.month;var already=D.transactions.some(function(t){return t.fromRec&&t.name===r.name&&t.month===mo;});if(already)return showToast(r.name+" already posted","var(--amber)");D.transactions.push({id:uid(),name:r.name,amount:r.amount,category:r.category,date:tod(),month:mo,fromRec:true});saveD();render();showToast(r.name+" posted!");}
function skipRec(id,month){var r=D.recurring.filter(function(r){return r.id===id;})[0];if(!r)return;var mo=month||D.month;var already=D.transactions.some(function(t){return(t.fromRec||t.fromRecSkip)&&t.name===r.name&&t.month===mo;});if(already)return showToast(r.name+" already handled","var(--amber)");var rules=(D.rerouteRules||[]).filter(function(rule){return rule.fromId===r.category;});if(rules.length>0){rules.forEach(function(rule){if(rule.destType==="goal"){var gname="";D.goals=D.goals.map(function(g){if(g.id!==rule.destId)return g;gname=g.name;return Object.assign({},g,{saved:g.saved+r.amount});});showToast(fmt(r.amount)+" → 💰 "+gname+"!");}else{D.budgets[rule.destId]=(D.budgets[rule.destId]||0)+r.amount;showToast(fmt(r.amount)+" → budget!");}});}else{if(D.goals.length>0){var g=D.goals[0];D.goals=D.goals.map(function(g2){return g2.id===g.id?Object.assign({},g2,{saved:g2.saved+r.amount}):g2;});showToast(fmt(r.amount)+" → "+g.name+"!");}else{showToast(fmt(r.amount)+" saved — add a goal to track it!","var(--amber)");}}D.transactions.push({id:uid(),name:r.name,amount:r.amount,category:r.category,date:tod(),month:mo,fromRecSkip:true});saveD();render();}
function addStream(){var n=document.getElementById("is-n"),a=document.getElementById("is-a"),d=document.getElementById("is-d"),f=document.getElementById("is-f");if(!n)return;var name=n.value.trim();if(!name)return showToast("Enter source name","var(--red)");D.incomeStreams.push({id:uid(),name:name,amount:Number(a&&a.value)||0,day:Number(d&&d.value)||1,freq:(f&&f.value)||"monthly"});saveD();patch({showAddStream:false});showToast("Income source added!");}
function saveStream(id){var n=document.getElementById("es-n"),a=document.getElementById("es-a"),d=document.getElementById("es-d"),f=document.getElementById("es-f");if(!n)return;D.incomeStreams=D.incomeStreams.map(function(s){return s.id===id?Object.assign({},s,{name:n.value.trim(),amount:Number(a&&a.value)||0,day:Number(d&&d.value)||1,freq:(f&&f.value)||s.freq}):s;});saveD();patch({editStream:null});}
function delStream(id){D.incomeStreams=D.incomeStreams.filter(function(s){return s.id!==id;});saveD();render();}
function addOneTimeIncome(){var n=document.getElementById("oti-n"),a=document.getElementById("oti-a");if(!n||!a)return;var name=n.value.trim(),amount=Number(a.value);if(!name||!amount)return showToast("Enter description and amount","var(--red)");if(!D.oneTimeIncome)D.oneTimeIncome=[];D.oneTimeIncome.push({id:uid(),name:name,amount:amount,date:tod(),month:D.month});saveD();render();showToast("Income added!");}

function doExport(){var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="quarterly-backup-"+D.month+".json";document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);showToast("Backup saved!");}
function doImport(event){var file=event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){try{var imported=JSON.parse(e.target.result);if(!imported.categories&&!imported.transactions){showToast("Invalid backup","var(--red)");return;}imported=sanitize(imported);Object.assign(D,imported);saveD();render();showToast("Backup restored!");}catch(err){showToast("Could not read file","var(--red)");}};reader.readAsText(file);event.target.value="";}
async function doImportPDF(event){var file=event.target.files[0];if(!file)return;showToast("Reading PDF...");var reader=new FileReader();reader.onload=async function(e){try{var base64=e.target.result.split(",")[1];showToast("AI scanning...");var body=JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},{type:"text",text:"Extract all debts from this document. Return ONLY valid JSON: {\"debts\":[{\"name\":\"creditor\",\"total\":0,\"paid\":0,\"rate\":0,\"monthly\":0}]}. If nothing found return {\"debts\":[]}."}]}]});var resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:body});var data=await resp.json();var text=(data.content&&data.content[0]&&data.content[0].text)||"{}";text=text.replace(/```json|```/g,"").trim();var result=JSON.parse(text);var added=0;(result.debts||[]).forEach(function(d){if(d.name&&d.total>0){var exists=D.debts.some(function(ex){return ex.name.toLowerCase()===d.name.toLowerCase();});if(!exists){D.debts.push({id:uid(),name:d.name,total:Number(d.total)||0,paid:0,rate:Number(d.rate)||0,monthly:Number(d.monthly)||0});added++;}}});if(added>0){saveD();render();showToast(added+" debt(s) imported!");patch({tab:"money",seg:"progress"});}else showToast("No new debts found","var(--amber)");}catch(err){showToast("Could not read PDF","var(--red)");}};reader.readAsDataURL(file);event.target.value="";}
